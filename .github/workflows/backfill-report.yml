name: Backfill Report

# 백필 현황 보고(2026-10-09) — 4시간마다 백필 결과(구장·팀·선수·응원가 등)를 집계해 Discord로 보낸다.
# 직전 보고 대비 증감과 24시간 이상 변화 없는 항목(정체)을 함께 표시. 수치는 backfill-report-state.json 에 저장.
# cron 은 UTC 기준: 매 4시간(KST 01·05·09·13·17·21시 5분 무렵).

on:
  schedule:
    - cron: '5 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write   # backfill-report-state.json commit

concurrency:
  group: backfill-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and send report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/backfill-report.mjs

      - name: Commit state
        run: |
          git add backfill-report-state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ops): backfill report state [skip ci]"
          for i in $(seq 1 20); do
            git pull --rebase --autostash origin main && git push origin main && exit 0 || sleep $((RANDOM % 30 + 1))
          done
          exit 1
