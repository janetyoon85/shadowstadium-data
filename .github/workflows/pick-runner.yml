name: pick-runner
# 네이버 의존 크롤러가 어느 러너에서 돌지 매 실행마다 고른다(2026-10-26 페일오버, 같은 날 NAS 우선으로 재정렬).
#  1순위: NAS 러너(`nas` 라벨)가 온라인이면 → nas  (집 회선 고정 IP라 네이버가 막지 않고, 한 바퀴 30~40초로 1분 주기를 감당)
#  2순위: NAS 가 없고 GitHub 서버에서 네이버 API 가 응답하면 → ubuntu-latest
#  3순위: 둘 다 아니면 → home-crawler (집 PC 셀프호스트 러너)
#  - NAS 온라인 확인은 읽기전용 토큰(secret RUNNER_STATUS_TOKEN, 이 저장소 Administration:read 만)으로 러너 목록을 조회한다.
#    토큰이 없거나 만료·조회 실패면 NAS 확인을 건너뛰고 예전 규칙(GitHub 응답하면 GitHub, 아니면 home-crawler)으로 폴백.
#  - 저장소 변수 CRAWLER_RUNNER 가 'nas' / 'ubuntu-latest' / 'home-crawler' 이면 그 값으로 강제(수동 고정), 비었거나 'auto' 면 위 규칙.
# 호출: 각 크롤러 워크플로우의 첫 잡이 `uses: ./.github/workflows/pick-runner.yml` 로 부르고, 본 잡은 `needs: pick` + `runs-on: ${{ needs.pick.outputs.runner }}`.
on:
  workflow_call:
    inputs:
      every_min:
        description: '실제 수집을 N분에 한 번만 한다(정각 기준 분 % N == 0). 1 이면 매 호출 실행(기본). 네이버 요청량 절감(2026-10-27)용 — fetch-schedule 이 저장소 변수 NAVER_FULL_EVERY_MIN 으로 넘긴다.'
        type: string
        default: '1'
      force:
        description: '수동 전체 실행·테스트 등은 간격과 무관하게 실행'
        type: string
        default: 'false'
    outputs:
      runner:
        description: 본 잡이 쓸 러너 라벨
        value: ${{ jobs.pick.outputs.runner }}
      run:
        description: '본 잡을 실행할지(true/false) — every_min 간격에 걸리면 false'
        value: ${{ jobs.pick.outputs.run }}
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.r.outputs.runner }}
      run: ${{ steps.cadence.outputs.run }}
    steps:
      # 네이버 요청량 절감(2026-10-27): 전체 시즌 수집(요청 97건)을 매분 돌리던 것을 every_min 분에 한 번으로 줄인다. GitHub 정기 실행(schedule)·force 는 항상 실행.
      - id: cadence
        env:
          EVERY: ${{ inputs.every_min }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          EVERY=${EVERY:-1}; case "$EVERY" in ''|*[!0-9]*) EVERY=1;; esac; [ "$EVERY" -lt 1 ] && EVERY=1
          M=$((10#$(date -u +%M)))
          if [ "$EVERY" -le 1 ] || [ "$FORCE" = "true" ] || [ "$EVENT" = "schedule" ] || [ $((M % EVERY)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "실행(분=$M, 간격=${EVERY}분)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "건너뜀(분=$M, 간격=${EVERY}분) — 네이버 요청 절감"
          fi
      - id: r
        env:
          FORCE: ${{ vars.CRAWLER_RUNNER }}
          RTOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$FORCE" ] && [ "$FORCE" != "auto" ]; then echo "runner=$FORCE" >> "$GITHUB_OUTPUT"; echo "고정: $FORCE"; exit 0; fi
          N=0
          if [ -n "$RTOKEN" ]; then
            N=$(curl -sf -m 10 -H "Authorization: Bearer $RTOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runners?per_page=100" | jq '[.runners[] | select(.status=="online") | select(any(.labels[]; .name=="nas"))] | length' 2>/dev/null || echo 0)
            N=${N:-0}
            echo "온라인 NAS 러너: $N"
          else
            echo "RUNNER_STATUS_TOKEN 없음 → NAS 우선 확인 생략"
          fi
          if [ "$N" -gt 0 ]; then
            echo "runner=nas" >> "$GITHUB_OUTPUT"; echo "NAS 온라인 → NAS"; exit 0
          fi
          U='https://api-gw.sports.naver.com/schedule/games?fromDate=2026-10-26&toDate=2026-10-26&upperCategoryId=kbaseball&categoryId=kbo&size=3'
          if curl -sf -m 8 -o /dev/null -A "Mozilla/5.0 (compatible; shadowstadium; +https://github.com/janetyoon85/shadowstadium-data)" "$U"; then
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"; echo "NAS 없음 + 네이버 응답 OK → GitHub 서버"
          else
            echo "runner=home-crawler" >> "$GITHUB_OUTPUT"; echo "NAS 없음 + 네이버 응답 없음 → 집 PC 러너"
          fi
