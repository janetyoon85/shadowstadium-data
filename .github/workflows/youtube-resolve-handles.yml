name: YouTube Resolve Handles

# 채널 핸들 후보 조사(수동, 1유닛/건): 로그에 채널 ID·이름·구독자·국가가 출력된다.
on:
  workflow_dispatch:
    inputs:
      handles:
        description: '쉼표로 구분한 핸들 목록(@ 생략 가능)'
        default: ''
      list_ids:
        description: '최근 업로드 제목을 볼 채널 ID 목록(쉼표 구분)'
        default: ''
      list_pages:
        description: '업로드 목록 페이지 수(50개/페이지)'
        default: '1'
      list_grep:
        description: '제목 필터 정규식(비우면 전체)'
        default: ''

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HANDLES: ${{ inputs.handles }}
          LIST_IDS: ${{ inputs.list_ids }}
          LIST_PAGES: ${{ inputs.list_pages }}
          LIST_GREP: ${{ inputs.list_grep }}
        run: node scripts/resolve-youtube-handles.mjs
