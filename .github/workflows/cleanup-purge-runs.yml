name: Cleanup Purge Runs

# FCM Purge Device Topics 는 실행 입력값에 기기 FCM 토큰을 넣는다 — 공개 저장소라 실행 기록 화면에 그대로 남는다(2026-11-01 보안 점검).
# 그 워크플로우가 끝나면(성공·실패 무관) 해당 실행 기록을 바로 삭제한다. 이 워크플로우 자체의 기록에는 토큰이 없다(입력 없음, workflow_run 이벤트).
on:
  workflow_run:
    workflows: ["FCM Purge Device Topics"]
    types: [completed]

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete the finished purge run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID")
            echo "attempt $i: HTTP $code"
            [ "$code" = "204" ] && exit 0
            sleep 5
          done
          echo "::warning::purge run $RUN_ID 삭제 실패 — 수동으로 지워 주세요"
          exit 1
