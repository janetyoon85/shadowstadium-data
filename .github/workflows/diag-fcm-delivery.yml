name: Diag FCM Delivery

# 알림 이중 수신 원인 진단(수동): 한 기기에 토큰 직접 / 토픽 1개 / 조건(여러 토픽) 테스트 알림을 15초 간격으로 보낸다. 끝나면 이 워크플로우는 지워도 된다.
on:
  workflow_dispatch:
    inputs:
      token:
        description: '기기 FCM 토큰(또는 진단 메시지 전체)'
        required: true
      team_keys:
        description: '조건 테스트에 쓸 팀 키(쉼표 구분)'
        default: 'espn:NBA:9,naver:NBA:GS,espn:NBA:13,naver:NBA:LAL'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Mask token
        env:
          FCM_IN: ${{ inputs.token }}
        run: |
          TOKEN=$(printf '%s' "$FCM_IN" | sed -n 's/.*token=\([^[:space:]]*\).*/\1/p' | head -1)
          [ -z "$TOKEN" ] && TOKEN=$(printf '%s' "$FCM_IN" | awk '{print $1}')
          echo "::add-mask::$TOKEN"
      - name: Send test messages
        env:
          FCM_TOKEN: ${{ inputs.token }}
          TEAM_KEYS: ${{ inputs.team_keys }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/diag-fcm-delivery.mjs
