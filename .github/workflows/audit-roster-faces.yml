name: Roster Photo Face Audit

on:
  schedule:
    # 3시간마다(사진 보충과 같은 concurrency 그룹이라 순서대로 돈다) — 한 번에 600장, 위키미디어는 직렬 1.5s 간격·429 즉시 중단.
    - cron: '55 */3 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: '이번 실행에서 판정할 사진 수'
        default: '600'

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-team-rosters
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenCV
        run: pip install "opencv-python-headless==4.10.0.84" "numpy<2.3"

      - name: Audit faces
        env:
          FACE_BUDGET: ${{ github.event.inputs.budget || '600' }}
        run: python scripts/audit-roster-faces.py

      - name: Apply veto
        run: node scripts/apply-photo-face-veto.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain team-rosters roster-photos.json roster-photo-faces.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team-rosters roster-photos.json roster-photo-faces.json
          mkdir -p /tmp/ours && cp roster-photo-faces.json /tmp/ours/
          git commit -m "chore(data): 선수 사진 얼굴 판정 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            if ! git pull --rebase --autostash origin main; then
              # 충돌해도 이번 실행의 판정을 버리지 않는다 — origin 으로 맞춘 뒤 판정 기록을 합쳐 다시 적용한다(네트워크 호출 없음).
              git rebase --abort || true
              git reset --hard origin/main
              FACES_MERGE_DIR=/tmp/ours node scripts/apply-photo-face-veto.mjs
              git add team-rosters roster-photos.json roster-photo-faces.json
              git commit -m "chore(data): 선수 사진 얼굴 판정 — 충돌 후 병합 ($(date +'%Y-%m-%d %H:%M'))" || exit 0
            fi
            sleep $((RANDOM % 8 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Roster photo face audit failed - ${date}`,
              body: `Roster photo face audit failed at ${date}.\n\nWorkflow run: ${context.runId}`,
              labels: ['bug', 'crawler']
            });
