name: ESPN National Leagues Fetch

on:
  # 2026-11-17: cron-job.org 외부 트리거(5분, workflow_dispatch)가 실행한다 — 올림픽 축구 수집기와 같은 방식. --auto 라 진행 중 경기가 없으면 ESPN 요청 0건.
  workflow_dispatch:

permissions:
  contents: write   # commit + push
  issues: write     # 실패 시 issue 생성

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 2026-09-30 긴급 추가 — fetch-schedule.yml 무한대기 사고 재발 방지, 전체 크롤러 공통 적용
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ESPN national leagues fetch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_AUTO: ${{ secrets.DISCORD_WEBHOOK_URL_AUTO }}
        run: node scripts/fetch-espn-national-leagues.mjs --auto # 외부 트리거(5분)용: 진행 중 경기가 있으면 3일 조회, 없으면 2시간마다 전체, 아니면 요청 0건

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain games.json espn-national-state.json espn-unmapped-venues.json espn-national-backfill.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 없는 파일이 하나라도 섞이면 git add 가 통째로 실패해 커밋할 게 없어진다 — 있는 파일만 하나씩 추가(2026-11-17 첫 자동 실행 실패 원인)
          for f in games.json espn-national-state.json espn-unmapped-venues.json espn-national-backfill.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && { echo "커밋할 변경 없음"; exit 0; }
          git commit -m "chore(data): ESPN 국가대표 대회 동기화 ($(date +'%Y-%m-%d'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            sleep $((RANDOM % 3 + 1))
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; echo "rebase failed, retrying"; }
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 ESPN national leagues fetch failed - ${date}`,
              body: `Daily ESPN national leagues fetch failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide ESPN 국가대표 대회 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
