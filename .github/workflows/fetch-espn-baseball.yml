name: Daily ESPN Baseball Fetch

on:
  schedule:
    # GitHub Actions cron 은 UTC 기준. KST = UTC+9. 09:00 KST = 00:00 UTC.
    # WBC/카리브해시리즈/올림픽야구는 몇 년에 한 번만 열려(카리브해시리즈만 매년 2월) 하루 1회면
    # 충분 — 날짜 하드코딩 없이 롤링 윈도우(오늘 ±)로 조회해서 다음 대회도 자동으로 잡힘.
    - cron: '0 0 * * *'
  workflow_dispatch:  # 수동 실행 가능 (테스트용)

permissions:
  contents: write   # commit + push
  issues: write     # 실패 시 issue 생성

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ESPN baseball fetch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/fetch-espn-baseball.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain games.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "chore(data): ESPN 야구(WBC/카리브해시리즈/올림픽) 동기화 ($(date +'%Y-%m-%d'))"
          # 매시 도는 메인 크롤러(fetch-schedule.yml)와 같은 브랜치에 동시에 push할 수 있어
          # non-fast-forward 거부 시 rebase 후 재시도.
          for i in $(seq 1 10); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/10)"
            git pull --rebase origin main
            sleep $((RANDOM % 15 + 1))
          done
          echo "push failed after 10 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 ESPN baseball fetch failed - ${date}`,
              body: `Daily ESPN baseball fetch failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 그늘각 ESPN 야구 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
