name: Daily Schedule Fetch

on:
  schedule:
    # GitHub Actions cron 은 UTC 기준. KST = UTC+9.
    # MLB/NPB/EPL/EFL 편입(2026-09) 이후 경기 종료 시각이 하루 전체에 걸쳐 흩어져 있어
    # 3회/일 → 매시 정각으로 상향. 네이버 비공식 API라 공식 rate limit 문서는 없음 —
    # 하루 24회(카테고리 조회만 ~720req/day)로 시작, 문제 생기면 다시 줄일 것.
    # FCM Reminders 가 매시 00/15/30/45 에 도는 것과 정각(0분)에 정면충돌해서
    # push 경합이 잦았음 — 7분으로 옮겨 겹칠 확률을 낮춤(완전 회피는 아니라 재시도도 유지).
    - cron: '7 * * * *'    # 매시 7분 (UTC = KST 매시)
  workflow_dispatch:  # 수동 실행 가능 (테스트용)
    inputs:
      test_discord:
        description: '실제 크롤링 없이 미매핑 구장 Discord 알림만 테스트 발송'
        type: boolean
        default: false

permissions:
  contents: write   # commit + push
  issues: write     # 실패 시 issue 생성

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run crawler
        id: crawler
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_DISCORD: ${{ inputs.test_discord }}
        run: node scripts/fetch-schedule.mjs

      - name: Infer rescheduledTo
        id: infer
        run: node scripts/infer-rescheduled.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain games_2026.json saves.json scorers.json assists.json euro_assists.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games_2026.json saves.json scorers.json assists.json euro_assists.json
          git commit -m "chore(data): daily schedule sync ($(date +'%Y-%m-%d'))"
          # FCM Reminders(15분 간격)가 같은 브랜치에 동시에 push할 수 있어
          # non-fast-forward 거부 시 rebase 후 재시도 (최대 5회).
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/5)"
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 1))
          done
          echo "push failed after 5 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Schedule fetch failed - ${date}`,
              body: `Daily crawler failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 그늘각 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
