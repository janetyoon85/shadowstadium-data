name: Daily Schedule Fetch

on:
  schedule:
    # GitHub Actions cron 은 UTC 기준. KST = UTC+9.
    # K리그/KBO는 앱의 핵심 리그인데 매시 1회만 돌아서(2026-09) 라이브 스코어가 최대 1시간까지
    # stale — 사용자가 직관 중 실시간으로 겪은 버그(목동 K리그2 경기, 서버는 이미 득점 반영
    # 됐는데 우리 데이터는 다음 정각까지 0:0 고정). 다른 라이브 크롤러들과 동일하게 GH 자체
    # cron은 매시 안전망으로만 두고, 실제 5분 주기는 cron-job.org 외부 트리거가 담당 —
    # 이 워크플로 추가할 때 cron-job.org 등록 필요(다른 라이브 크롤러들처럼).
    # FCM Reminders 가 매시 00/15/30/45 에 도는 것과 정각(0분) 겹침 방지로 7분 유지.
    - cron: '7 * * * *'    # 매시 7분 (UTC = KST 매시) — 안전망
  workflow_dispatch:  # cron-job.org 5분 주기 트리거 + 수동 실행용
    inputs:
      test_discord:
        description: '실제 크롤링 없이 미매핑 구장 Discord 알림만 테스트 발송'
        type: boolean
        default: false

permissions:
  contents: write   # commit + push
  issues: write     # 실패 시 issue 생성

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run crawler
        id: crawler
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_DISCORD: ${{ inputs.test_discord }}
        run: node scripts/fetch-schedule.mjs

      - name: Infer rescheduledTo
        id: infer
        run: node scripts/infer-rescheduled.mjs

      # games_2026.json → games.json 리네임 전환기 호환용 레거시 별칭(2026-09).
      # OTA 못 받은 구버전 앱이 여전히 옛 URL로 fetch하므로 당분간 병행 — TODO(2026-10초):
      # 신규 클라이언트 채택률 확인 후 이 스텝과 git add 목록의 games_2026.json 제거.
      - name: Write legacy filename alias (transition compat)
        run: cp games.json games_2026.json

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain games.json games_2026.json saves.json scorers.json assists.json euro_assists.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json games_2026.json saves.json scorers.json assists.json euro_assists.json
          git commit -m "chore(data): daily schedule sync ($(date +'%Y-%m-%d'))"
          # FCM Reminders(15분 간격) + WBSC/아시안게임 야구·축구 크롤러들(5분 간격, 2026-09
          # 추가)까지 같은 브랜치에 동시에 push할 수 있어 non-fast-forward 거부가 잦아짐 —
          # rebase 후 재시도 (최대 10회, 동시 writer 늘어난 만큼 5회에서 상향).
          for i in $(seq 1 10); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/10)"
            git pull --rebase origin main
            sleep $((RANDOM % 15 + 1))
          done
          echo "push failed after 10 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Schedule fetch failed - ${date}`,
              body: `Daily crawler failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 그늘각 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
