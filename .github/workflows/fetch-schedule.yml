name: Daily Schedule Fetch

on:
  schedule:
    # GitHub Actions cron 은 UTC 기준. KST = UTC+9.
    # K리그/KBO는 앱의 핵심 리그인데 매시 1회만 돌아서(2026-09) 라이브 스코어가 최대 1시간까지
    # stale — 사용자가 직관 중 실시간으로 겪은 버그(목동 K리그2 경기, 서버는 이미 득점 반영
    # 됐는데 우리 데이터는 다음 정각까지 0:0 고정). 다른 라이브 크롤러들과 동일하게 GH 자체
    # cron은 매시 안전망으로만 두고, 실제 5분 주기는 cron-job.org 외부 트리거가 담당 —
    # 이 워크플로 추가할 때 cron-job.org 등록 필요(다른 라이브 크롤러들처럼).
    # FCM Reminders 가 매시 00/15/30/45 에 도는 것과 정각(0분) 겹침 방지로 7분 유지.
    - cron: '7 * * * *'    # 매시 7분 (UTC = KST 매시) — 안전망
  workflow_dispatch:  # cron-job.org 5분 주기 트리거 + 수동 실행용
    inputs:
      test_discord:
        description: '실제 크롤링 없이 미매핑 구장 Discord 알림만 테스트 발송'
        type: boolean
        default: false
      full_run:
        description: '전체 모드(백필·종료 후 재검증 예산 사용)로 실행 — 평소엔 매 실행이 예산의 1/8 만 사용(2026-10-26 개편)'
        type: boolean
        default: false

permissions:
  contents: write   # commit + push
  issues: write     # 실패 시 issue 생성
  actions: read     # 직전 실행 결과 조회(연속 실패 알림 도배 방지)

# 동시성 제어(2026-09-27 추가) — 백필 컷오프 확장(3일→35일) 직후 처리량이 늘면서 한 실행이
# 평소 5분보다 훨씬 오래 걸리자, cron-job.org 5분 트리거가 매번 새 병렬 실행을 만들어 같은
# 미백필 대상을 여러 실행이 동시에 중복 fetch하는 걸 실측 확인(한 시점에 6개 실행이 동시에
# in_progress). cancel-in-progress:false 로 큐잉만 시켜서(취소는 진행 중이던 캐치업 작업 유실
# 위험이 있어 안 씀) 다음 트리거는 이전 실행이 끝날 때까지 대기하도록 함.
concurrency:
  group: fetch-schedule
  cancel-in-progress: false

# 네이버 API 호환(Node TLS1.3 핸드셰이크 후 멈춤 회피) — scripts/lib/naver-tls.mjs
env:
  NAVER_TLS12: '1'
  # 페일오버 신호(2026-10-30) — 이 크롤러가 끝날 때 네이버 요청 통계로 건강 상태를 이 파일에 기록한다(상태 전환·10분 하트비트에만 갱신).
  NAVER_HEALTH_FILE: naver-health.json
  # 분당 한도에 걸려도 요청을 버리지 않고 창이 비기를 기다려 전체 수집을 끝까지 한다(scripts/lib/naver-guard.mjs, 2026-10-28)
  NAVER_WAIT_MINUTE_BUDGET_S: '120'

jobs:
  # 어느 러너에서 돌릴지 정한다(GitHub 서버에서 네이버가 응답하면 GitHub 서버, 아니면 집 PC) — .github/workflows/pick-runner.yml
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
    with:
      # 네이버 요청량 절감(2026-10-27): 전체 시즌 수집은 요청 97건이라 매분 돌면 시간당 ~5,800건 — 변수 NAVER_FULL_EVERY_MIN(기본 5)분에 한 번만 실제 수집. 1 로 두면 예전처럼 매분.
      every_min: ${{ vars.NAVER_FULL_EVERY_MIN || '5' }}
      force: ${{ (inputs.full_run || inputs.test_discord) && 'true' || 'false' }}
  fetch:
    needs: pick
    if: needs.pick.outputs.run == 'true'
    runs-on: ${{ needs.pick.outputs.runner }}
    defaults:
      run:
        shell: bash
    # 잡 레벨 타임아웃(2026-09-30 긴급 추가) — 실측 확인: 한 실행이 "in_progress" 상태로 20분+
    # 멈춰있는 걸 GitHub Actions API로 직접 발견(스크립트 안 fetch 호출들에 타임아웃/
    # AbortController가 전혀 없어서 하나만 멎어도 잡 전체가 GH Actions 기본값인 6시간까지
    # 무한 대기 가능 — cancel-in-progress:false라 그동안 뒤 트리거들도 전부 큐에 쌓여 파이프라인
    # 전체가 멈춤). 정상 실행은 5~6분대라 10분이면 충분히 여유 있고, 진짜 멎은 경우만 잘라냄.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 활동 게이트(2026-10-27, 네이버 요청량 절감): 진행·임박 경기가 없으면 전체 시즌 수집(요청 97건)을 NAVER_IDLE_EVERY_MIN(기본 30)분에 한 번만 한다. 수동 전체 실행·테스트는 항상 통과.
      - name: Activity gate
        id: act
        env:
          FORCE: ${{ (inputs.full_run || inputs.test_discord) && '1' || '' }}
          IDLE_EVERY_MIN: ${{ vars.NAVER_IDLE_EVERY_MIN || '30' }}
        run: node scripts/naver-activity-gate.mjs

      - name: Run crawler
        id: crawler
        if: steps.act.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_AUTO: ${{ secrets.DISCORD_WEBHOOK_URL_AUTO }}
          TEST_DISCORD: ${{ inputs.test_discord }}
          FULL_RUN: ${{ inputs.full_run && '1' || '' }}
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/fetch-schedule.mjs

      - name: Infer rescheduledTo
        id: infer
        if: steps.act.outputs.skip != 'true'
        run: node scripts/infer-rescheduled.mjs

      # 즐겨찾기 선수 알림(2026-09-28) 검색 인덱스 — games.json은 이 크롤러 말고도
      # ESPN 해외축구 크롤러들도 scorers를 채우므로, 이 스텝에서 막 커밋 예정인 games.json을
      # 다시 읽어서 전체를 반영(단일 인메모리 상태만 보면 다른 크롤러 리그가 빠짐).
      - name: Build player search index
        if: steps.act.outputs.skip != 'true'
        run: node scripts/build-player-index.mjs

      # games_2026.json → games.json 리네임 전환기 호환용 레거시 별칭(2026-09).
      # OTA 못 받은 구버전 앱이 여전히 옛 URL로 fetch하므로 당분간 병행 — TODO(2026-10초):
      # 신규 클라이언트 채택률 확인 후 이 스텝과 git add 목록의 games_2026.json 제거.
      - name: Write legacy filename alias (transition compat)
        if: steps.act.outputs.skip != 'true'
        run: cp games.json games_2026.json

      - name: Check for changes
        id: changes
        if: steps.act.outputs.skip != 'true'
        run: |
          if [[ -n "$(git status --porcelain naver-health.json games.json games_2026.json saves.json scorers.json assists.json euro_assists.json euro_shootout.json euro-reval.json players.json player-codes.json player-name-auto.json unmapped-venue-alerts.json stadium-auto-map.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json games_2026.json saves.json scorers.json assists.json euro_assists.json cards.json euro_cards.json euro_shootout.json euro-reval.json players.json player-codes.json player-name-auto.json unmapped-venue-alerts.json stadium-auto-map.json
          git add -A ops-ledger 2>/dev/null || true   # 운영 장부(스스로 조치한 일) — 폴더가 없으면 무시
          git add naver-health.json 2>/dev/null || true   # 네이버 건강 신호
          git commit -m "chore(data): daily schedule sync ($(date +'%Y-%m-%d'))"
          # FCM Reminders(15분 간격) + WBSC/아시안게임 야구·축구 크롤러들(5분 간격, 2026-09
          # 추가)까지 같은 브랜치에 동시에 push할 수 있어 non-fast-forward 거부가 잦아짐 —
          # rebase 후 재시도 (최대 20회, 크롤러 개수 계속 늘어난 만큼 10회에서 재상향, 2026-09-20).
          # 2026-09-30: 푸시 거부 후 git pull --rebase 자체가 실패(작업트리 미커밋 변경 / games.json 충돌)하면
          # bash -e 때문에 루프 재시도 없이 3초 만에 스텝이 죽어 7분치 크롤링이 통째로 버려졌음(최근 8회 중 3회).
          # --autostash 로 미커밋 변경 보존, 충돌 시 이번 실행(우리 커밋) 쪽을 우선(-X theirs = rebase에서 재적용되는
          # 우리 커밋; 다른 크롤러가 덮인 부분은 5분 내 다음 주기에 복구), 그래도 실패하면 abort 후 재시도.
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; echo "rebase failed, retrying"; }
            sleep $((RANDOM % 6 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      # 연속 실패 알림 도배 방지(2026-10-26) — 네이버 접속이 몇십 분 막히자 2분마다 실패 이슈 100여 개와 Discord 알림이 쌓였다.
      # 직전 실행이 성공이었을 때(= 새로 실패하기 시작했을 때)만 이슈·Discord 로 알린다. 이미 실패가 이어지는 중이면 조용히 넘어간다.
      - name: Check previous run
        id: prev
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({ owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'fetch-schedule.yml', status: 'completed', per_page: 5 });
            const prev = runs.data.workflow_runs.find((r) => r.id !== context.runId && r.run_number < context.runNumber);
            core.setOutput('prev_failed', prev && prev.conclusion === 'failure' ? 'true' : 'false');

      - name: Create issue on failure
        if: failure() && steps.prev.outputs.prev_failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Schedule fetch failed - ${date}`,
              body: `Daily crawler failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure() && steps.prev.outputs.prev_failed != 'true'
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
