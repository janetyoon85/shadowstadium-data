name: fetch-basketball-stats
on:
  schedule:
    # 안전망 — 평소엔 cron-job.org 가 매시 workflow_dispatch 로 호출한다. GitHub 스케줄은 지연·누락이 잦아 보조로만 둔다(스크립트가 50분 안 재실행은 건너뜀).
    - cron: '35 * * * *'
  workflow_dispatch:
concurrency:
  group: fetch-basketball-stats
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    # 네이버 API 가 GitHub 호스티드 러너(Azure IP)를 막은 동안(2026-10-26~) 집 PC 의 셀프호스트 러너(home-crawler)에서 돌린다. 저장소 변수 CRAWLER_RUNNER 가 없으면 예전처럼 ubuntu-latest.
    runs-on: ${{ vars.CRAWLER_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run basketball stats crawler
        run: node scripts/fetch-basketball-stats.mjs
      - name: Commit and push
        run: |
          if [[ -z "$(git status --porcelain basketball/stats.json basketball/player-wd.json)" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball/stats.json basketball/player-wd.json
          git commit -m "chore(data): 농구 팀/선수기록 갱신 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep $((RANDOM % 30 + 1))
          done
          exit 1
