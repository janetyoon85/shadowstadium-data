name: fetch-basketball-stats
on:
  schedule:
    # 안전망 — 평소엔 cron-job.org 가 매시 workflow_dispatch 로 호출한다. GitHub 스케줄은 지연·누락이 잦아 보조로만 둔다(스크립트가 50분 안 재실행은 건너뜀).
    - cron: '35 * * * *'
  workflow_dispatch:
concurrency:
  group: fetch-basketball-stats
  cancel-in-progress: false
permissions:
  contents: write
# 네이버 API 호환(Node TLS1.3 핸드셰이크 후 멈춤 회피) — scripts/lib/naver-tls.mjs
env:
  NAVER_TLS12: '1'
  # 분당 한도에 걸려도 요청을 버리지 않고 창이 비기를 기다려 전체 수집을 끝까지 한다(scripts/lib/naver-guard.mjs, 2026-10-28)
  NAVER_WAIT_MINUTE_BUDGET_S: '120'

jobs:
  # 어느 러너에서 돌릴지 정한다(GitHub 서버에서 네이버가 응답하면 GitHub 서버, 아니면 집 PC) — .github/workflows/pick-runner.yml
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
  fetch:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # 최신 main 기준(큐 대기 중 낡은 커밋 방지)

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run basketball stats crawler
        run: node scripts/fetch-basketball-stats.mjs
      - name: Commit and push
        run: |
          if [[ -z "$(git status --porcelain basketball/stats.json basketball/player-wd.json)" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball/stats.json basketball/player-wd.json
          git commit -m "chore(data): 농구 팀/선수기록 갱신 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then exit 0; fi
            git pull --rebase --autostash -X theirs origin main || git rebase --abort
            sleep $((RANDOM % 8 + 1))
          done
          exit 1
