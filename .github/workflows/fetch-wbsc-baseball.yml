name: WBSC Baseball Fetch

on:
  schedule:
    # GitHub Actions 자체 cron은 지연·누락이 잦아 신뢰 못 함(기존 크롤러들과 동일 이유) — 매시
    # 1회만 안전망으로 두고, 실제 5분 주기 라이브 갱신은 cron-job.org 외부 트리거가 담당
    # (workflow_dispatch 호출, 다른 라이브 크롤러들과 같은 방식 — BFA U-18 아시아선수권처럼
    # 진행 중인 대회가 있을 때 점수가 몇 시간씩 안 바뀌는 걸 막기 위함).
    - cron: '10 * * * *'
  workflow_dispatch:  # cron-job.org 5분 주기 트리거 + 수동 실행용

permissions:
  contents: write   # commit + push
  issues: write     # 실패 시 issue 생성

# 5분마다 겹쳐 돌면 .wbsc-scraperapi-budget.json 카운터가 레이스로 이중 집계될 수 있어(2026-09-28,
# ScraperAPI 예산제 도입과 함께 추가) — fetch-schedule.yml과 동일 패턴으로 큐잉.
concurrency:
  group: fetch-wbsc-baseball
  cancel-in-progress: false

jobs:
  fetch:
    # 2026-10-27: WBSC 계열 사이트는 GitHub 서버(데이터센터 IP)를 막아 유료 프록시(ScraperAPI)를 썼다. 집 회선(NAS·PC 러너)에서는 막지 않아 프록시 없이 직접 받는다.
    runs-on: home-crawler
    defaults:
      run:
        shell: bash
    timeout-minutes: 10  # 2026-09-30 긴급 추가 — fetch-schedule.yml 무한대기 사고 재발 방지, 전체 크롤러 공통 적용
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run WBSC baseball fetch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_AUTO: ${{ secrets.DISCORD_WEBHOOK_URL_AUTO }}
          # 직접(집 IP) 먼저, 막히면(403/429/오류) ScraperAPI 로 자동 페일오버 — 키는 페일오버 때만 쓰인다(월 900건 예산).
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: node scripts/fetch-wbsc-baseball.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain games.json .wbsc-alert-state.json .wbsc-scraperapi-budget.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json .wbsc-alert-state.json .wbsc-scraperapi-budget.json
          git add -A ops-ledger 2>/dev/null || true   # 운영 장부(스스로 조치한 일) — 폴더가 없으면 무시
          git commit -m "chore(data): WBSC 야구(U-18/U-15/U-23 월드컵) 동기화 ($(date +'%Y-%m-%d'))"
          # 다른 야간 크롤러들과 같은 브랜치에 동시에 push할 수 있어 non-fast-forward 거부 시
          # rebase 후 재시도.
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            sleep $((RANDOM % 3 + 1))
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; echo "rebase failed, retrying"; }
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 WBSC baseball fetch failed - ${date}`,
              body: `Daily WBSC baseball fetch failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide WBSC 야구 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
