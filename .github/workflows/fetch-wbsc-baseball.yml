name: WBSC Baseball Fetch

on:
  schedule:
    # GitHub Actions 자체 cron은 지연·누락이 잦아 신뢰 못 함(기존 크롤러들과 동일 이유) — 매시
    # 1회만 안전망으로 두고, 실제 5분 주기 라이브 갱신은 cron-job.org 외부 트리거가 담당
    # (workflow_dispatch 호출, 다른 라이브 크롤러들과 같은 방식 — BFA U-18 아시아선수권처럼
    # 진행 중인 대회가 있을 때 점수가 몇 시간씩 안 바뀌는 걸 막기 위함).
    - cron: '10 * * * *'
  workflow_dispatch:  # cron-job.org 5분 주기 트리거 + 수동 실행용

permissions:
  contents: write   # commit + push
  issues: write     # 실패 시 issue 생성

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run WBSC baseball fetch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/fetch-wbsc-baseball.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain games.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "chore(data): WBSC 야구(U-18/U-15/U-23 월드컵) 동기화 ($(date +'%Y-%m-%d'))"
          # 다른 야간 크롤러들과 같은 브랜치에 동시에 push할 수 있어 non-fast-forward 거부 시
          # rebase 후 재시도.
          for i in $(seq 1 10); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/10)"
            git pull --rebase origin main
            sleep $((RANDOM % 15 + 1))
          done
          echo "push failed after 10 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 WBSC baseball fetch failed - ${date}`,
              body: `Daily WBSC baseball fetch failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 그늘각 WBSC 야구 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
