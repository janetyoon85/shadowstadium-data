name: Highlight Videos

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      deep:
        description: '1 = 채널 업로드 목록을 깊게 훑는다(백필: 이미 저장된 경기에 대체 후보 alts 채우기)'
        default: '0'
      pages:
        description: '깊게 훑을 때 채널당 페이지 수(1페이지=50개=1유닛)'
        default: '3'
      avail_calls:
        description: '영상 지역 확인 호출 상한(1호출=50개=1유닛, 백필은 60)'
        default: '6'
      avail_refresh_days:
        description: '이 일수가 지난 영상만 다시 확인(기본 7). 0 = 전부 즉시 확인(저장 영상 제목 갱신·삭제 영상 정리 점검용)'
        default: '7'

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-highlight-videos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 대기열에 있던 실행은 "요청 시점의 커밋"을 체크아웃해 앞선 실행의 결과(저장 파일)를 모르는 낡은 상태로 시작하고, 마지막 푸시의 `-X theirs` 병합이 그 낡은 파일로 덮어썼다
          # (2026-10-13 백필 결과 하이라이트 1,028건·영상 확인 2,674건이 되돌려짐). 항상 최신 main 에서 시작한다.
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Match highlight videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HL_DEEP: ${{ github.event.inputs.deep || '0' }}
          HL_PAGES: ${{ github.event.inputs.pages || '3' }}
        run: node scripts/fetch-highlight-videos.mjs

      # 저장된 영상의 지역별 재생 가능 여부 확인(새 영상 우선, 7일 지난 것 갱신) — videos.list 는 50개당 1유닛, 실행당 최대 6호출.
      - name: Check video availability
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AVAIL_MAX_CALLS: ${{ github.event.inputs.avail_calls || '6' }}
          AVAIL_REFRESH_DAYS: ${{ github.event.inputs.avail_refresh_days || '7' }}
        run: node scripts/youtube-availability.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain highlights-video.json highlights-deep.json highlights-search.json video-availability.json highlight-channel-ids.json cheer-songs.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add highlights-video.json highlights-deep.json highlights-search.json video-availability.json highlight-channel-ids.json cheer-songs.json
          git commit -m "chore(data): 경기 하이라이트 영상 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; echo "rebase failed, retrying"; }
            sleep $((RANDOM % 30 + 1))
          done
          echo "push failed after 20 retries"
          exit 1
