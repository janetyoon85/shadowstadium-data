name: FCM Player Alert Test

# 즐겨찾기 선수 알림 수신 테스트(수동). Actions 탭에서 Run workflow → 선수 이름 입력 → 해당 선수 토픽 구독 기기에 테스트 푸시.
on:
  workflow_dispatch:
    inputs:
      name:
        description: '즐겨찾기한 선수 이름 (예: 김도영)'
        required: true
      player_id:
        description: '선수 ID(선택, 예: kbo:b:50500) — 앱은 ID로 즐겨찾기를 저장하므로 ID 토픽으로도 보낸다'
        default: ''
      use_tag:
        description: '1 = 모든 언어에 같은 tag(합치기 테스트), 0 = 진단(구독 중인 언어 수만큼 따로 보임)'
        default: '0'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Send test
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PLAYER_NAME: ${{ inputs.name }}
          USE_TAG: ${{ inputs.use_tag }}
          PLAYER_ID: ${{ inputs.player_id }}
        run: node scripts/send-test-player-alert.mjs
