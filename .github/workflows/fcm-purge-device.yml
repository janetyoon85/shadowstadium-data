name: FCM Purge Device Topics

# 한 기기(FCM 토큰)에 남은 예전 언어/옛 토픽 구독을 서버에서 해제(수동). 기기 정보(앱 설정 제목 길게 누르기 진단 메시지)는 입력이 아니라 비공개 저장소 shadowstadium-secrets/fcm-device.txt 에서 읽는다.
on:
  workflow_dispatch:
    inputs:
      keep_lang:
        description: '남길 언어 코드'
        default: 'ko'
      dry_run:
        description: '1 = 해제하지 않고 후보 개수만'
        default: '1'
      non_fav_teams:
        description: '1 = 즐겨찾기가 아닌 모든 팀의 알림 구독도 해제(favs 의 teams·bkTeams 가 현재 목록과 정확히 같을 때만)'
        default: '0'

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Load device info (private)
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          # 기기 토큰은 입력값이 아니라 비공개 저장소(shadowstadium-secrets/fcm-device.txt)에서 읽는다 — 공개 저장소의 실행 기록에 토큰이 남지 않게(2026-11-03).
          set -eu
          f="$(mktemp)"
          curl -fsSL -H "Authorization: Bearer $PRIVATE_DATA_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/janetyoon85/shadowstadium-secrets/contents/fcm-device.txt" -o "$f"
          TOKEN="$(sed -n 's/.*token=\([^[:space:]]*\).*/\1/p' "$f" | head -1)"
          [ -z "$TOKEN" ] && TOKEN="$(head -1 "$f" | tr -d '[:space:]')"
          echo "::add-mask::$TOKEN"
          { echo "FCM_TOKEN<<__FCM_EOF__"; cat "$f"; echo; echo "__FCM_EOF__"; } >> "$GITHUB_ENV"
          rm -f "$f"
      - name: Purge
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEEP_LANG: ${{ inputs.keep_lang }}
          DRY_RUN: ${{ inputs.dry_run }}
          PURGE_NON_FAV_TEAMS: ${{ inputs.non_fav_teams }}
        run: node scripts/purge-device-topics.mjs
