name: FCM Purge Device Topics

# 한 기기(FCM 토큰)에 남은 예전 언어/옛 토픽 구독을 서버에서 해제(수동). 앱 설정 제목을 길게 눌러 공유한 메시지의 token= 값을 입력.
on:
  workflow_dispatch:
    inputs:
      token:
        description: '앱 설정 제목 길게 누르기로 공유된 메시지 전체(token=·favs= 줄 포함)'
        required: true
      keep_lang:
        description: '남길 언어 코드'
        default: 'ko'
      dry_run:
        description: '1 = 해제하지 않고 후보 개수만'
        default: '1'
      non_fav_teams:
        description: '1 = 즐겨찾기가 아닌 모든 팀의 알림 구독도 해제(favs 의 teams·bkTeams 가 현재 목록과 정확히 같을 때만)'
        default: '0'

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Mask token
        env:
          FCM_IN: ${{ inputs.token }}
        run: |
          TOKEN=$(printf '%s' "$FCM_IN" | sed -n 's/.*token=\([^[:space:]]*\).*/\1/p' | head -1)
          [ -z "$TOKEN" ] && TOKEN=$(printf '%s' "$FCM_IN" | head -1 | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
      - name: Purge
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FCM_TOKEN: ${{ inputs.token }}
          KEEP_LANG: ${{ inputs.keep_lang }}
          DRY_RUN: ${{ inputs.dry_run }}
          PURGE_NON_FAV_TEAMS: ${{ inputs.non_fav_teams }}
        run: node scripts/purge-device-topics.mjs
