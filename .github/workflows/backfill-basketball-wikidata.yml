name: Basketball Wikidata Backfill

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-basketball-wikidata
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run basketball wikidata backfill
        run: node scripts/backfill-basketball-wikidata.mjs
      - name: Commit and push
        run: |
          if [[ -z "$(git status --porcelain basketball/player-wd.json)" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball/player-wd.json
          git commit -m "chore(data): 농구 위키데이터 백필 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then exit 0; fi
            if ! git pull --rebase origin main; then
              node scripts/merge-json-conflicts.mjs && GIT_EDITOR=true git rebase --continue || { git rebase --abort; git reset --hard origin/main; exit 1; }
            fi
            sleep $((RANDOM % 30 + 1))
          done
          exit 1
