name: Cheer Songs Backfill

on:
  schedule:
    # YouTube Data API 무료 쿼터(하루 10,000유닛, search 100유닛 → ~100건)가 태평양시 자정(07:00 UTC)에
    # 리셋되므로 그 직후 하루 1회.
    - cron: '40 7 * * *'
    # 2026-11-12: 경기 하이라이트 검색이 우선 — 응원가는 하루 한도(1,000회)에서 하이라이트 사용분·예비를 뺀 남는 몫만 자동으로 쓴다(scripts/lib/yt-quota-day.mjs).
    # 태평양시 하루 끝(겨울 07:40 UTC)에 남는 한도를 몰아 쓰고, 낮(19:40 UTC)에도 한 번 더 돈다.
    - cron: '40 19 * * *'
  push:
    # 수동 즉시 실행용(2026-11-12): 이 파일을 갱신해 푸시하면 한 번 돈다(gh CLI 없는 환경에서 workflow_dispatch 대신).
    paths: ['.github/cheer-run-now']
  workflow_dispatch:
    inputs:
      budget:
        description: '이번 실행의 검색 예산(비우면 자동: 하이라이트 우선·남는 한도)'
        required: false
        default: ''
      discover:
        description: 'MLB 워크업 채널 발굴(검색 30건 사용, 파일 변경 없음) — 1 입력 시'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: backfill-cheer-songs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run cheer songs backfill
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHEER_BUDGET: ${{ inputs.budget }}
          CHEER_DISCOVER: ${{ inputs.discover }}
        run: node scripts/backfill-cheer-songs.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain cheer-songs.json cheer-search-usage.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cheer-songs.json cheer-search-usage.json
          git commit -m "chore(data): 선수 응원가 백필 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; echo "rebase failed, retrying"; }
            sleep $((RANDOM % 8 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide 응원가 백필 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
