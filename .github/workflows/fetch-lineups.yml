name: Fetch Lineups

# 선발·교체 명단 + 박스스코어 수집(2026-11-08) → lineups/<날짜>/<리그>.json (경기 id → 라인업, 앱이 경기 상세에서 읽는다) + lineup-subs.json(교체 알림용) + lineups.json(옛 앱 호환).
#  · 축구: 진행 중·종료 경기 — 다음스포츠 상세(선발·벤치·교체 분)
#  · 야구(KBO): 종료 경기 — 네이버 /record(타순·교체·투수 등판 + 타자·투수 기록)
# 보조 데이터라 실패해도 워크플로는 성공으로 끝난다(스크립트가 exit 0). 확정(f:1)된 경기는 다시 받지 않는다. lineups.json 만 쓴다(games.json 과 충돌 없음).
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '조회·출력만(저장·커밋 안 함) — true/false'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: fetch-lineups
  cancel-in-progress: false

# 네이버 API 호환(Node TLS1.3 핸드셰이크 후 멈춤 회피) — scripts/lib/naver-tls.mjs
env:
  NAVER_TLS12: '1'

jobs:
  # 어느 러너에서 돌릴지 정한다(GitHub 서버에서 네이버가 응답하면 GitHub 서버, 아니면 집 PC) — .github/workflows/pick-runner.yml
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
    with:
      fallback_runner: ubuntu-latest
  lineups:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Trim workspace (self-hosted)
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        shell: bash
        run: |
          # 영구형 러너의 작업 폴더 .git 에 얕은 체크아웃 객체가 쌓인다(NAS 러너 1대 110GB, 2026-11-13). 불필요한 것은 쌓지 않고 바로 지운다:
          #  · 300MB 넘으면 필요 없는 객체만 즉시 삭제(reflog 만료 + gc --prune=now) — 현재 객체는 남아 다음 체크아웃은 변경분만 받는다
          #  · 크기를 못 재거나(거대) gc 가 실패하면 .git 을 작업 폴더 밖 휴지통으로 이름만 바꿔 옮기고(즉시) 백그라운드로 지운다
          base="$RUNNER_WORKSPACE"
          rotate() { mv .git "$base/.git-trash-$(date -u +%Y%m%d%H%M%S)" 2>/dev/null || rm -rf .git; echo ".git moved to trash"; }
          if [ -d .git ]; then
            kb=$(timeout 20 du -sk .git 2>/dev/null | cut -f1) || kb=""
            if [ -z "$kb" ]; then
              rotate
            elif [ "$kb" -gt 307200 ]; then
              timeout 180 sh -c 'git reflog expire --expire=now --all && git gc --prune=now --quiet' && echo ".git pruned ($((kb/1024))MB -> $(du -sm .git | cut -f1)MB)" || rotate
            fi
          fi
          if ls -d "$base"/.git-trash-* >/dev/null 2>&1; then
            # 러너는 잡이 끝날 때 이 잡이 띄운 고아 프로세스를 정리하므로 추적 변수를 빼고 새 세션으로 띄운다(없으면 그냥 지움).
            if command -v setsid >/dev/null 2>&1; then
              setsid env -u RUNNER_TRACKING_ID nohup rm -rf "$base"/.git-trash-* >/dev/null 2>&1 &
            else
              rm -rf "$base"/.git-trash-*
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main 을 받는다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Disk watch (self-hosted)
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/disk-watch.mjs

      - name: Collect lineups
        env:
          NAVER_DISABLED: ${{ needs.pick.outputs.naver_disabled }}
          LINEUPS_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
        run: node scripts/fetch-lineups.mjs

      - name: K리그 선수정보 사전 수집 (실패해도 무시)
        continue-on-error: true
        run: node scripts/build-kleague-player-info.mjs

      - name: KBO·NPB 선수정보 사전 수집 (실패해도 무시)
        continue-on-error: true
        run: node scripts/build-baseball-player-info.mjs

      - name: 야구 대표팀 대회 기록 집계 (실패해도 무시)
        continue-on-error: true
        run: node scripts/build-national-baseball-stats.mjs

      - name: 원정 이동 거리 집계 (6시간 간격·실패해도 무시)
        continue-on-error: true
        timeout-minutes: 5
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: node scripts/build-away-distance.mjs

      # NBA 경기 전 "발표된 선발"(2026-11-10) — NBA 공식 CDN 박스스코어에서 킥오프 약 10~25분 전에 올라오는 공식 선발(팀당 5명 확정 시에만). 예정 경기가 창(-20~+90분) 안일 때만 요청한다.
      - name: NBA 경기 전 발표된 선발 (실패해도 무시)
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/fetch-nba-starters.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain lineups.json lineup-subs.json lineups kleague-player-info.json baseball-player-info.json national-baseball-stats.json away-distance.json basketball/prestart.json ops-ledger)" ]]; then echo "changed=true" >> $GITHUB_OUTPUT; else echo "changed=false" >> $GITHUB_OUTPUT; fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lineups.json lineup-subs.json 2>/dev/null || git add -A lineups.json
          [ -f kleague-player-info.json ] && git add kleague-player-info.json || true
          [ -f baseball-player-info.json ] && git add baseball-player-info.json || true
          [ -f national-baseball-stats.json ] && git add national-baseball-stats.json || true
          [ -f away-distance.json ] && git add away-distance.json || true
          [ -f basketball/prestart.json ] && git add basketball/prestart.json || true
          [ -d lineups ] && git add -A lineups || true   # 날짜/리그 파일(삭제 포함)
          [ -d ops-ledger ] && git add -A ops-ledger || true   # 운영 장부(자동 조치 기록 — 디스크 자동 정리 등)
          git commit -m "chore(data): 선발·교체 명단 갱신 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; echo "rebase failed, retrying"; }
            sleep $((RANDOM % 6 + 1))
          done
          echo "push failed after 20 retries"
          exit 1
