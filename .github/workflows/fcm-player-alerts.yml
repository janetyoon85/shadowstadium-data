name: FCM Player Alerts

# 즐겨찾기 선수 알림(2026-09-28). 매 5분(UTC) games.json의 scorers를 훑어서 신규 골/어시를
# player_<hash> 토픽으로 발송. fcm-reminders.yml과 동일 패턴(cron-job.org 5분 트리거 +
# 시간당 GH Actions 안전망), 독립 워크플로로 둬서 어느 크롤러가 games.json을 마지막으로
# 갱신했든 상관없이 항상 최종 병합 상태를 봄.

on:
  schedule:
    - cron: '20 * * * *'  # UTC, 매시 20분 — 다른 크론들과 겹침 방지, 안전망
  workflow_dispatch:  # cron-job.org 5분 주기 트리거 + 수동 실행용

permissions:
  contents: write   # sent-player-alerts.json commit + push

concurrency:
  group: fcm-player-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 2026-09-30 긴급 추가 — fetch-schedule.yml 무한대기 사고 재발 방지, 전체 크롤러 공통 적용
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Send player alerts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node scripts/notify-player-events.mjs
          node scripts/notify-basketball-final.mjs
          node scripts/notify-team-final.mjs

      - name: Commit sent state
        run: |
          git add sent-player-alerts.json sent-bk-alerts.json sent-team-final.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(player-alerts): update sent state [skip ci]"
          for i in $(seq 1 20); do
            git pull --rebase --autostash origin main && git push origin main && exit 0 || sleep $((RANDOM % 30 + 1))
          done
          echo "::error::Failed to push sent-player-alerts.json after 20 retries"
          exit 1
