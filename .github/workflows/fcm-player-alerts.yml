name: FCM Player Alerts

# 즐겨찾기 선수 알림(2026-09-28). 매 5분(UTC) games.json의 scorers를 훑어서 신규 골/어시를
# player_<hash> 토픽으로 발송. fcm-reminders.yml과 동일 패턴(cron-job.org 5분 트리거 +
# 시간당 GH Actions 안전망), 독립 워크플로로 둬서 어느 크롤러가 games.json을 마지막으로
# 갱신했든 상관없이 항상 최종 병합 상태를 봄.

on:
  schedule:
    - cron: '20 * * * *'  # UTC, 매시 20분 — 다른 크론들과 겹침 방지, 안전망
  workflow_dispatch:  # cron-job.org 5분 주기 트리거 + 수동 실행용

permissions:
  contents: write   # sent-player-alerts.json commit + push

concurrency:
  group: fcm-player-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 2026-09-30 긴급 추가 — fetch-schedule.yml 무한대기 사고 재발 방지, 전체 크롤러 공통 적용
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Send player alerts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
        # 2026-10-27: 알림 5종을 한 번 돌리고 끝내는 대신 약 55초 동안 10초마다 반복 확인한다(감시 루프). 매 반복마다 NAS 가 올린 신선한 이벤트를 받아 커밋된 데이터 위에
        # 덮어써서 감지 → 이벤트 후 알림까지 평균 약 2분 → 20~40초 목표. 오버레이를 못 받으면 예전처럼 커밋된 파일만 쓴다. 되돌리려면 아래 한 줄을 예전 5줄로 바꾼다.
        run: node scripts/alert-loop.mjs

      - name: Commit sent state
        timeout-minutes: 4  # 2026-10-26: git 이 응답 없이 멈추면(서버 쪽 지연) 이 단계가 10분까지 흐름을 막았다 — 짧게 끊고 다음 실행이 이어가게 한다
        run: |
          FILES="sent-player-alerts.json sent-bk-alerts.json sent-team-final.json sent-team-highlights.json sent-team-live.json"
          git add $FILES
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 1분 주기(2026-10-26)에서 줄 단위 rebase 가 큰 JSON 에서 충돌해 저장이 20번 모두 실패했다(알림 중복 발송 위험).
          # 기록은 추가만 되므로: 내 파일을 따로 두고 → 원격 최신으로 리셋 → 합집합으로 합쳐 → 커밋·푸시. 충돌이 날 수 없다.
          rm -rf "$RUNNER_TEMP/mine" && mkdir -p "$RUNNER_TEMP/mine" && cp $FILES "$RUNNER_TEMP/mine/"
          for i in $(seq 1 20); do
            timeout 60 git fetch -q origin main && git reset -q --hard origin/main \
              && node scripts/merge-sent-state.mjs "$RUNNER_TEMP/mine" $FILES \
              && git add $FILES \
              && { git diff --cached --quiet && exit 0; git commit -q -m "chore(player-alerts): update sent state [skip ci]" && timeout 60 git push -q origin main && exit 0; } \
              || sleep $((RANDOM % 10 + 1))
          done
          echo "::error::Failed to push sent state after 20 retries"
          exit 1
