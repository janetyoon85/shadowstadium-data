name: Team Info Backfill

on:
  schedule:
    # 2시간마다(팀 1,413개를 회당 100개씩 위키 호출 제한 내에서 채움).
    - cron: '40 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run team info backfill
        run: node scripts/backfill-team-info.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain team-info)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team-info
          git commit -m "chore(data): 팀 정보 백필 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            git pull --rebase origin main
            sleep $((RANDOM % 30 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Team info backfill failed - ${date}`,
              body: `Team info backfill crawler failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide 팀 정보 백필 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
