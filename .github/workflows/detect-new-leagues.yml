name: Detect New Leagues

# 네이버에 새 리그/대회(categoryId)가 생겼는지 하루 한 번 확인한다 — 예: 2026-11 APBC 가 열렸는데 수집 목록에 없어 경기가 빠져 있었다.
# 새로 발견하면 Discord 자동조치 채널에 "🆕 신규 리그 발견 — 자동조치 대상" 을 보내고 운영 장부에 남겨 일일 보고에 표시한다.
# (등록 — 수집·검증·앱 필터·구장 매핑 — 은 Claude 가 알림을 보고 이어서 처리한다.) 기준선·알린 기록: new-league-seen.json, 무시할 카테고리: new-league-ignore.json({categoryId: 사유}).
# 네이버가 GitHub 서버를 막을 수 있어 다른 네이버 크롤러처럼 pick-runner 로 러너를 고른다. cron-job.org 에서 하루 1회 dispatch 하도록 등록(GitHub schedule 은 자주 누락).
on:
  schedule:
    - cron: '20 21 * * *'   # 매일 06:20 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detect-new-leagues
  cancel-in-progress: false

env:
  NAVER_TLS12: '1'

jobs:
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
    with:
      force: 'true'
  detect:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - name: Trim workspace (self-hosted)
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        shell: bash
        run: |
          # 영구형 러너의 작업 폴더 .git 에 얕은 체크아웃 객체가 쌓인다(NAS 러너 1대 110GB, 2026-11-13). 불필요한 것은 쌓지 않고 바로 지운다:
          #  · 300MB 넘으면 필요 없는 객체만 즉시 삭제(reflog 만료 + gc --prune=now) — 현재 객체는 남아 다음 체크아웃은 변경분만 받는다
          #  · 크기를 못 재거나(거대) gc 가 실패하면 .git 을 작업 폴더 밖 휴지통으로 이름만 바꿔 옮기고(즉시) 백그라운드로 지운다
          base="$RUNNER_WORKSPACE"
          rotate() { mv .git "$base/.git-trash-$(date -u +%Y%m%d%H%M%S)" 2>/dev/null || rm -rf .git; echo ".git moved to trash"; }
          if [ -d .git ]; then
            kb=$(timeout 20 du -sk .git 2>/dev/null | cut -f1) || kb=""
            if [ -z "$kb" ]; then
              rotate
            elif [ "$kb" -gt 307200 ]; then
              timeout 180 sh -c 'git reflog expire --expire=now --all && git gc --prune=now --quiet' && echo ".git pruned ($((kb/1024))MB -> $(du -sm .git | cut -f1)MB)" || rotate
            fi
          fi
          if ls -d "$base"/.git-trash-* >/dev/null 2>&1; then
            # 러너는 잡이 끝날 때 이 잡이 띄운 고아 프로세스를 정리하므로 추적 변수를 빼고 새 세션으로 띄운다(없으면 그냥 지움).
            if command -v setsid >/dev/null 2>&1; then
              setsid env -u RUNNER_TRACKING_ID nohup rm -rf "$base"/.git-trash-* >/dev/null 2>&1 &
            else
              rm -rf "$base"/.git-trash-*
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect new leagues
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_AUTO: ${{ secrets.DISCORD_WEBHOOK_URL_AUTO }}
        run: node scripts/detect-new-leagues.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-league-seen.json 2>/dev/null || true
          git add -A ops-ledger 2>/dev/null || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "chore(data): 신규 리그 감시 기록 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            timeout 60 git pull -q --rebase origin main && timeout 60 git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 8 + 1))
          done
          echo "::error::푸시 실패"
          exit 1
