name: League Standings Fetch

on:
  schedule:
    # 순위표는 경기 하나 끝난다고 매번 안 바뀌어서(스코어/카드용 5분 주기 크론들과 예산 경합
    # 시킬 이유 없음) 3시간 주기로 충분 — 하루 8회.
    - cron: '15 */3 * * *'
  push:
    paths: ['.github/standings-run-now']  # 수동 즉시 실행용(gh CLI 없는 환경)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# 네이버 API 호환(Node TLS1.3 핸드셰이크 후 멈춤 회피) — scripts/lib/naver-tls.mjs
env:
  NAVER_TLS12: '1'
  # 분당 한도에 걸려도 요청을 버리지 않고 창이 비기를 기다려 전체 수집을 끝까지 한다(scripts/lib/naver-guard.mjs, 2026-10-28)
  NAVER_WAIT_MINUTE_BUDGET_S: '120'

jobs:
  # 어느 러너에서 돌릴지 정한다(GitHub 서버에서 네이버가 응답하면 GitHub 서버, 아니면 집 PC) — .github/workflows/pick-runner.yml
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
  fetch:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Trim workspace (self-hosted)
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        shell: bash
        run: |
          # 영구형 러너의 작업 폴더 .git 에 얕은 체크아웃 객체가 계속 쌓인다(NAS 러너 1대 110GB, 2026-11-13). 크기를 재지 않고(거대하면 du 가 수 분) 6시간마다 .git 을
          # 작업 폴더 밖 휴지통으로 이름만 바꿔 옮기고(즉시) 백그라운드로 지운다 — 다음 체크아웃이 새로 받는다(하루 4회, 약 125MB).
          base="$RUNNER_WORKSPACE"
          key="$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))"
          stamp="$base/.gitreset-stamp"
          if [ -d .git ] && [ "$(cat "$stamp" 2>/dev/null || true)" != "$key" ]; then
            mv .git "$base/.git-trash-$key" && echo "$key" > "$stamp" && echo "moved .git to trash ($key)"
          fi
          if ls -d "$base"/.git-trash-* >/dev/null 2>&1; then
            # 러너는 잡이 끝날 때 이 잡이 띄운 고아 프로세스를 정리하므로 추적 변수를 빼고 새 세션으로 띄운다(없으면 그냥 지움).
            if command -v setsid >/dev/null 2>&1; then
              setsid env -u RUNNER_TRACKING_ID nohup rm -rf "$base"/.git-trash-* >/dev/null 2>&1 &
            else
              rm -rf "$base"/.git-trash-*
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run standings fetch
        run: node scripts/fetch-standings.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain standings.json mlb-naver-pid.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standings.json mlb-naver-pid.json 2>/dev/null || git add standings.json
          git commit -m "chore(data): 순위표 동기화 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            sleep $((RANDOM % 3 + 1))
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; echo "rebase failed, retrying"; }
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Standings fetch failed - ${date}`,
              body: `Standings crawler failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide 순위표 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
