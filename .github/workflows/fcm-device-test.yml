name: FCM Device Direct Test

# 한 기기(FCM 토큰)로 직접 진단 푸시 2건(수동) — 토픽 구독과 무관하게 기기까지 가는지 확인. 기기 정보는 입력이 아니라 비공개 저장소 shadowstadium-secrets/fcm-device.txt 에서 읽는다(공개 실행 기록에 토큰이 남지 않게).
on:
  workflow_dispatch:
    inputs:
      note:
        description: '메모(선택) — 기기 정보는 비공개 저장소 fcm-device.txt 에서 읽는다'
        default: ''

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Load device info (private)
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.PRIVATE_DATA_TOKEN }}
        run: |
          # 기기 토큰은 입력값이 아니라 비공개 저장소(shadowstadium-secrets/fcm-device.txt)에서 읽는다 — 공개 저장소의 실행 기록에 토큰이 남지 않게(2026-11-03).
          set -eu
          f="$(mktemp)"
          curl -fsSL -H "Authorization: Bearer $PRIVATE_DATA_TOKEN" -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/janetyoon85/shadowstadium-secrets/contents/fcm-device.txt" -o "$f"
          TOKEN="$(sed -n 's/.*token=\([^[:space:]]*\).*/\1/p' "$f" | head -1)"
          [ -z "$TOKEN" ] && TOKEN="$(head -1 "$f" | tr -d '[:space:]')"
          echo "::add-mask::$TOKEN"
          { echo "FCM_TOKEN<<__FCM_EOF__"; cat "$f"; echo "__FCM_EOF__"; } >> "$GITHUB_ENV"
          rm -f "$f"
      - name: Send direct test
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-test-device.mjs
