name: FCM Reminders

# Phase 4B per-user lead 푸시. 매 5분(UTC)마다 [1,3,6,12,24]h 윈도우 도달한 (game,lead)
# 쌍을 game_<id>_h<L> 토픽으로 발송. sent-reminders.json 에 dedup 상태 커밋.
#
# 원래 15분 주기였는데, cron-reminders.mjs 의 발송 로직이 "정확히 그 시각"이 아니라
# "윈도우 도달 후 다음 틱에 발송"이라 최악의 경우 최대 14분 지연 가능 — 경기 시작 시각이
# 전부 :00/:30 이던 초기엔 무해했지만, 리그가 늘면서 :38 같은 임의 분 시작 경기가 생겨
# 지연이 체감될 수 있음(2026-09-19 사용자 리포트). 5분 주기로 줄여 최악 지연을 4분으로 단축.
# 공개 repo 라 GitHub Actions 분 무제한이라 주기를 줄이는 데 비용 제약 없음.

on:
  schedule:
    - cron: '*/5 * * * *'  # UTC, 모든 5분
  workflow_dispatch:  # 수동 실행 (테스트용)

permissions:
  contents: write   # sent-reminders.json commit + push

# 동시 실행 방지 (이전 run 미완료면 새 run skip — 발송 중복 race 차단)
concurrency:
  group: fcm-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cron-reminders.mjs

      # 캐시 워밍 piggyback — KST 13:00–19:30, 오늘 경기 구장 /api/kma 데움.
      # 윈도우 밖/경기 없음 = no-op. 실패해도 리마인더 발송과 무관 → continue-on-error.
      - name: Warm weather cache
        continue-on-error: true
        run: node scripts/warm-weather.mjs

      - name: Commit sent state
        timeout-minutes: 4  # git 이 응답 없이 멈추면 흐름이 막히므로 짧게 끊는다(2026-10-26)
        run: |
          FILES="sent-reminders.json"
          git add $FILES
          # 변경 없으면 step 성공 종료
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 2026-10-26(1분 주기): 줄 단위 rebase 가 한 줄짜리 큰 JSON 에서 충돌해 20번 모두 실패 → 발송 기록이 안 남아 리마인더 중복 발송 위험.
          # 기록은 추가만 되므로: 내 파일을 따로 두고 → 원격 최신으로 리셋 → 합집합으로 합쳐 → 커밋·푸시(충돌 불가). fcm-player-alerts 와 같은 방식.
          rm -rf "$RUNNER_TEMP/mine" && mkdir -p "$RUNNER_TEMP/mine" && cp $FILES "$RUNNER_TEMP/mine/"
          for i in $(seq 1 20); do
            timeout 60 git fetch -q origin main && git reset -q --hard origin/main \
              && node scripts/merge-sent-state.mjs "$RUNNER_TEMP/mine" $FILES \
              && git add $FILES \
              && { git diff --cached --quiet && exit 0; git commit -q -m "chore(reminders): update sent state [skip ci]" && timeout 60 git push -q origin main && exit 0; } \
              || sleep $((RANDOM % 10 + 1))
          done
          echo "::error::Failed to push sent-reminders.json after 20 retries"
          exit 1
