name: FCM Reminders

# Phase 4B per-user lead 푸시. 매 15분(UTC)마다 [1,3,6,12,24]h 윈도우 도달한 (game,lead)
# 쌍을 game_<id>_h<L> 토픽으로 발송. sent-reminders.json 에 dedup 상태 커밋.
#
# 15분 주기는 짧은 1h lead 의 안정성(최대 14분 지연) 위함. 공개 repo 라 분 무제한.

on:
  schedule:
    - cron: '*/15 * * * *'  # UTC, 모든 15분 (00, 15, 30, 45)
  workflow_dispatch:  # 수동 실행 (테스트용)

permissions:
  contents: write   # sent-reminders.json commit + push

# 동시 실행 방지 (이전 run 미완료면 새 run skip — 발송 중복 race 차단)
concurrency:
  group: fcm-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cron-reminders.mjs

      - name: Commit sent state
        run: |
          if [[ -n "$(git status --porcelain sent-reminders.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent-reminders.json
            git commit -m "chore(reminders): update sent state [skip ci]"
            git push
          fi
