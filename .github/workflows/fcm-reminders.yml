name: FCM Reminders

# Phase 4B per-user lead 푸시. 매 15분(UTC)마다 [1,3,6,12,24]h 윈도우 도달한 (game,lead)
# 쌍을 game_<id>_h<L> 토픽으로 발송. sent-reminders.json 에 dedup 상태 커밋.
#
# 15분 주기는 짧은 1h lead 의 안정성(최대 14분 지연) 위함. 공개 repo 라 분 무제한.

on:
  # ⚠️ 비활성화 2026-06-18: 매일 실패하던 FCM 푸시 cron 정지 (코드 보존, 삭제 X).
  # 앱은 현재 expo 로컬 알림(6h 전)을 사용하고 FCM 서버 푸시는 미연동 → 레거시 상태.
  # FCM 푸시 실연동 시 아래 schedule 주석을 해제하면 매 15분 cron 복원.
  # 참고: 이 cron 은 warm-weather(날씨 캐시 워밍) piggyback 도 함께 돌렸음 → 함께 정지됨.
  # schedule:
  #   - cron: '*/15 * * * *'  # UTC, 모든 15분 (00, 15, 30, 45)
  workflow_dispatch:  # 수동 실행 (테스트용) — 비활성화 후에도 수동 트리거 가능

permissions:
  contents: write   # sent-reminders.json commit + push

# 동시 실행 방지 (이전 run 미완료면 새 run skip — 발송 중복 race 차단)
concurrency:
  group: fcm-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cron-reminders.mjs

      # 캐시 워밍 piggyback — KST 13:00–19:30, 오늘 경기 구장 /api/kma 데움.
      # 윈도우 밖/경기 없음 = no-op. 실패해도 리마인더 발송과 무관 → continue-on-error.
      - name: Warm weather cache
        continue-on-error: true
        run: node scripts/warm-weather.mjs

      - name: Commit sent state
        run: |
          git add sent-reminders.json
          # 변경 없으면 step 성공 종료
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(reminders): update sent state [skip ci]"
          # 동시 push race (예: fetch-schedule cron이 main에 push) 대비 rebase + 3회 retry.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0 || sleep 3
          done
          echo "::error::Failed to push sent-reminders.json after 3 retries"
          exit 1
