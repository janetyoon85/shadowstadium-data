name: Team Info I18n Backfill

on:
  schedule:
    # 2시간마다(팀 1,413개를 회당 100개씩 위키 호출 제한 내에서 채움).
    - cron: '25 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: backfill-team-info-i18n
  cancel-in-progress: false

jobs:
  fetch:
    # 2026-10-28: GitHub 호스티드(Azure IP)에서는 구글 번역(비공식 gtx)이 첫 요청부터 429 라 번역이 진행되지 않고 매시간 429 알림만 떴다 → 집 회선(NAS/PC 러너)에서 실행.
    # (집 PC 에서 요청 시 200 확인.) 이 워크플로우는 schedule/workflow_dispatch 전용이라 공개 저장소의 셀프호스트 러너에서 돌려도 안전하다.
    runs-on: home-crawler
    defaults:
      run:
        shell: bash
    timeout-minutes: 55
    steps:
      - name: Trim workspace (self-hosted)
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        shell: bash
        run: |
          # 영구형 러너의 작업 폴더 .git 에 얕은 체크아웃 객체가 계속 쌓인다(NAS 러너 1대 110GB, 2026-11-13). 크기를 재지 않고(거대하면 du 가 수 분) 6시간마다 .git 을
          # 작업 폴더 밖 휴지통으로 이름만 바꿔 옮기고(즉시) 백그라운드로 지운다 — 다음 체크아웃이 새로 받는다(하루 4회, 약 125MB).
          base="$RUNNER_WORKSPACE"
          key="$(date -u +%Y%m%d)-$(( 10#$(date -u +%H) / 6 ))"
          stamp="$base/.gitreset-stamp"
          if [ -d .git ] && [ "$(cat "$stamp" 2>/dev/null || true)" != "$key" ]; then
            mv .git "$base/.git-trash-$key" && echo "$key" > "$stamp" && echo "moved .git to trash ($key)"
          fi
          if ls -d "$base"/.git-trash-* >/dev/null 2>&1; then
            # 러너는 잡이 끝날 때 이 잡이 띄운 고아 프로세스를 정리하므로 추적 변수를 빼고 새 세션으로 띄운다(없으면 그냥 지움).
            if command -v setsid >/dev/null 2>&1; then
              setsid env -u RUNNER_TRACKING_ID nohup rm -rf "$base"/.git-trash-* >/dev/null 2>&1 &
            else
              rm -rf "$base"/.git-trash-*
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run team info backfill
        env:
          NAVER_TLS12: '1'   # 구글 번역(gtx)이 Node20 기본 TLS 에 429 → TLS1.2 로 제한(scripts/lib/naver-tls.mjs)
        run: node scripts/backfill-team-info-i18n.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain team-info-i18n)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add team-info-i18n
          git commit -m "chore(data): 팀 정보 번역 백필 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            if ! git pull --rebase --autostash origin main; then
              node scripts/merge-json-conflicts.mjs && GIT_EDITOR=true git rebase --continue || { git rebase --abort; git reset --hard origin/main; echo "conflict unresolved, dropping this run's result"; exit 1; }
            fi
            sleep $((RANDOM % 8 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Team info i18n backfill failed - ${date}`,
              body: `Team info i18n backfill crawler failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide 팀 정보 번역 백필 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
