name: Venue Photos Audit

on:
  schedule:
    # 6시간마다 — 구장 사진이 그 구장 것인지 위키미디어 분류·설명·사용처로 재검증(직렬 요청 3s 간격, 실행당 API 20회 상한, 제한 응답 시 즉시 중단).
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: '이번 실행의 위키미디어 API 요청 상한'
        default: '20'

permissions:
  contents: write
  issues: write

concurrency:
  group: backfill-venue-photos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Audit venue photos
        env:
          VENUE_AUDIT_MAX_REQUESTS: ${{ github.event.inputs.budget || '20' }}
        run: node scripts/audit-venue-photos.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain venue-photo-audit.json venue-photos.json venue-photos-commons-tried.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add venue-photo-audit.json venue-photos.json venue-photos-commons-tried.json
          mkdir -p /tmp/ours && cp venue-photo-audit.json /tmp/ours/
          git commit -m "chore(data): 구장 사진 재검증 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            if ! git pull --rebase --autostash origin main; then
              # 충돌해도 이번 실행의 검증 결과를 버리지 않는다 — origin 으로 맞춘 뒤 보관한 검증 기록을 합친다(네트워크 호출 없음).
              git rebase --abort || true
              git reset --hard origin/main
              AUDIT_MERGE_DIR=/tmp/ours node scripts/audit-venue-photos.mjs
              git add venue-photo-audit.json venue-photos.json venue-photos-commons-tried.json
              git commit -m "chore(data): 구장 사진 재검증 — 충돌 후 병합 ($(date +'%Y-%m-%d %H:%M'))" || exit 0
            fi
            sleep $((RANDOM % 8 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Venue photos audit failed - ${date}`,
              body: `Venue photos audit failed at ${date}.\n\nWorkflow run: ${context.runId}`,
              labels: ['bug', 'crawler']
            });
