name: diag-naver
# 임시 진단(2026-10-26) — GitHub 러너에서 네이버 API 접속이 되는지, 어떤 UA 가 막히는지 확인. 확인 후 삭제한다.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "runner ip: $(curl -s -m 10 https://api.ipify.org)"
          U='https://api-gw.sports.naver.com/schedule/games?fromDate=2026-10-26&toDate=2026-10-26&upperCategoryId=kbaseball&categoryId=kbo&size=5'
          for ua in "Mozilla/5.0 (compatible; shadowstadium; +https://github.com/janetyoon85/shadowstadium-data)" "Mozilla/5.0" "curl/8.0"; do
            curl -s -m 15 -o /dev/null -w "%{http_code} %{time_connect}s connect %{time_total}s total | $ua\n" -A "$ua" "$U" || echo "FAIL | $ua"
          done
          curl -s -m 15 -o /dev/null -w "sports.naver.com %{http_code} %{time_total}s\n" https://sports.naver.com/ || echo "sports.naver.com FAIL"
          nslookup api-gw.sports.naver.com | tail -4
