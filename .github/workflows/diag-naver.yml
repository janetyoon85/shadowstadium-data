name: diag-naver
# 임시 진단 — GitHub 호스티드 러너에서 네이버 API 가 응답하는지 확인(확인 후 삭제)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          U='https://api-gw.sports.naver.com/schedule/games?fromDate=2026-10-26&toDate=2026-10-26&upperCategoryId=kbaseball&categoryId=kbo&size=5'
          curl -s -m 12 -o /dev/null -w "naver-api %{http_code} %{time_total}s\n" -A "Mozilla/5.0 (compatible; shadowstadium; +https://github.com/janetyoon85/shadowstadium-data)" "$U" || echo "naver-api BLOCKED(timeout)"
