name: probe-nba-cdn
on:
  workflow_dispatch:
  push:
    paths: [".github/nba-probe-now"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: probe
        timeout-minutes: 2
        run: |
          u=https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json
          {
          echo "runner: $RUNNER_NAME / $RUNNER_ENVIRONMENT"
          curl -sS -m 15 --connect-timeout 8 -o /tmp/o.json -w "ua-crawler: %{http_code} size=%{size_download}\n" -A "Mozilla/5.0 (ShadeSideCrawler)" -H "Referer: https://www.nba.com/" "$u" || echo "ua-crawler: fail"
          curl -sS -m 15 --connect-timeout 8 -o /tmp/o2.json -w "ua-chrome: %{http_code} size=%{size_download}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" -H "Referer: https://www.nba.com/" "$u" || echo "ua-chrome: fail"
          head -c 150 /tmp/o.json
          } > .github/nba-probe-result.txt 2>&1
      - name: save
        timeout-minutes: 2
        run: |
          git config user.name probe; git config user.email probe@example.com
          git add .github/nba-probe-result.txt; git commit -qm "chore: nba probe result"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
