name: probe-nba-cdn
on:
  workflow_dispatch:
  push:
    paths: [".github/nba-probe-now"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          u=https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json
          {
          for ua in "Mozilla/5.0 (ShadeSideCrawler)" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"; do
            curl -sS -m 20 -o /tmp/o.json -w "%{http_code} size=%{size_download}\n" -A "$ua" -H "Referer: https://www.nba.com/" "$u" || echo "fail"
          done
          head -c 200 /tmp/o.json
          } > .github/nba-probe-result.txt 2>&1
          git config user.name probe; git config user.email probe@example.com
          git add .github/nba-probe-result.txt; git commit -qm "chore: nba probe result"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 3; done
