name: Asian Games Football Fetch

on:
  schedule:
    # GitHub Actions 자체 cron은 안전망으로만 사용(매시 1회) — 실제 5분 주기는 cron-job.org
    # 외부 트리거(workflow_dispatch)가 담당, 다른 라이브 크롤러들과 동일 패턴. 대회기간(9/14~10/3)
    # 지나면 cron-job.org 트리거는 꺼도 됨.
    - cron: '30 * * * *'
  workflow_dispatch:  # cron-job.org 5분 주기 트리거 + 수동 실행용

permissions:
  contents: write   # commit + push
  issues: write     # 실패 시 issue 생성

jobs:
  fetch:
    # 대회(2026 아이치·나고야 아시안게임)가 끝나서(축구 10/3·야구 9/27 전 경기 종료) 기본은 건너뜀. 다음 대회 때 repo 변수 ASIAN_GAMES_ACTIVE=true 로 켠다.
    # (cron-job.org 매분 호출은 이 조건으로 즉시 '건너뜀' 처리 — 429 실패·알림·러너 사용 없음. 해당 cron-job 은 지워도 된다.)
    if: ${{ vars.ASIAN_GAMES_ACTIVE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 2026-09-30 긴급 추가 — fetch-schedule.yml 무한대기 사고 재발 방지, 전체 크롤러 공통 적용
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Asian Games football fetch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_AUTO: ${{ secrets.DISCORD_WEBHOOK_URL_AUTO }}
        run: node scripts/fetch-asiangames-football.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain games.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "chore(data): 아시안게임 축구 동기화 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            sleep $((RANDOM % 3 + 1))
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; echo "rebase failed, retrying"; }
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Asian Games football fetch failed - ${date}`,
              body: `Asian Games football fetch failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide 아시안게임 축구 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
