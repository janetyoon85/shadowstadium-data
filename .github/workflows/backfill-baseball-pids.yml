name: Baseball Pids Backfill

on:
  schedule:
    # 1시간마다 — 종료 경기 중 pid 없는 선수 참조가 남은 KBO/NPB 경기의 박스스코어 이름→코드 표를 만든다(네이버 /record, 요청 간격 1.2s).
    - cron: '40 * * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: '이번 실행에서 조회할 경기 수'
        default: '300'

permissions:
  contents: write
  issues: write

concurrency:
  group: backfill-baseball-pids
  cancel-in-progress: false

jobs:
  fetch:
    # 네이버 API 가 GitHub 호스티드 러너(Azure IP)를 막은 동안(2026-10-26~) 집 PC 의 셀프호스트 러너(home-crawler)에서 돌린다. 저장소 변수 CRAWLER_RUNNER 가 없으면 예전처럼 ubuntu-latest.
    runs-on: ${{ vars.CRAWLER_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backfill baseball pids
        env:
          PID_BACKFILL_BUDGET: ${{ github.event.inputs.budget || '300' }}
        run: node scripts/backfill-baseball-pids.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain game-player-pids.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-player-pids.json
          git commit -m "chore(data): 야구 선수 pid 표 갱신 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              git reset --hard origin/main
              echo "conflict, dropping this run's result"
              exit 1
            fi
            sleep $((RANDOM % 30 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Baseball pids backfill failed - ${date}`,
              body: `Baseball pids backfill failed at ${date}.\n\nWorkflow run: ${context.runId}`,
              labels: ['bug', 'crawler']
            });
