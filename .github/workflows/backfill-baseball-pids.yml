name: Baseball Pids Backfill

on:
  schedule:
    # 1시간마다 — 종료 경기 중 pid 없는 선수 참조가 남은 KBO/NPB 경기의 박스스코어 이름→코드 표를 만든다(네이버 /record, 요청 간격 1.2s).
    - cron: '40 * * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: '이번 실행에서 조회할 경기 수'
        default: '300'

permissions:
  contents: write
  issues: write

concurrency:
  group: backfill-baseball-pids
  cancel-in-progress: false

# 네이버 API 호환(Node TLS1.3 핸드셰이크 후 멈춤 회피) — scripts/lib/naver-tls.mjs
env:
  NAVER_TLS12: '1'
  # 분당 한도에 걸려도 요청을 버리지 않고 창이 비기를 기다려 전체 수집을 끝까지 한다(scripts/lib/naver-guard.mjs, 2026-10-28)
  NAVER_WAIT_MINUTE_BUDGET_S: '120'

jobs:
  # 어느 러너에서 돌릴지 정한다(GitHub 서버에서 네이버가 응답하면 GitHub 서버, 아니면 집 PC) — .github/workflows/pick-runner.yml
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
  fetch:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Trim workspace (self-hosted)
        if: runner.environment == 'self-hosted'
        continue-on-error: true
        shell: bash
        run: |
          # 영구형 러너의 작업 폴더 .git 에 얕은 체크아웃 객체가 쌓인다(NAS 러너 1대 110GB, 2026-11-13). 불필요한 것은 쌓지 않고 바로 지운다:
          #  · 300MB 넘으면 필요 없는 객체만 즉시 삭제(reflog 만료 + gc --prune=now) — 현재 객체는 남아 다음 체크아웃은 변경분만 받는다
          #  · 크기를 못 재거나(거대) gc 가 실패하면 .git 을 작업 폴더 밖 휴지통으로 이름만 바꿔 옮기고(즉시) 백그라운드로 지운다
          base="$RUNNER_WORKSPACE"
          rotate() { mv .git "$base/.git-trash-$(date -u +%Y%m%d%H%M%S)" 2>/dev/null || rm -rf .git; echo ".git moved to trash"; }
          if [ -d .git ]; then
            kb=$(timeout 20 du -sk .git 2>/dev/null | cut -f1) || kb=""
            if [ -z "$kb" ]; then
              rotate
            elif [ "$kb" -gt 307200 ]; then
              timeout 180 sh -c 'git reflog expire --expire=now --all && git gc --prune=now --quiet' && echo ".git pruned ($((kb/1024))MB -> $(du -sm .git | cut -f1)MB)" || rotate
            fi
          fi
          if ls -d "$base"/.git-trash-* >/dev/null 2>&1; then
            # 러너는 잡이 끝날 때 이 잡이 띄운 고아 프로세스를 정리하므로 추적 변수를 빼고 새 세션으로 띄운다(없으면 그냥 지움).
            if command -v setsid >/dev/null 2>&1; then
              setsid env -u RUNNER_TRACKING_ID nohup rm -rf "$base"/.git-trash-* >/dev/null 2>&1 &
            else
              rm -rf "$base"/.git-trash-*
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backfill baseball pids
        env:
          PID_BACKFILL_BUDGET: ${{ github.event.inputs.budget || '300' }}
        run: node scripts/backfill-baseball-pids.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain game-player-pids.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-player-pids.json
          git commit -m "chore(data): 야구 선수 pid 표 갱신 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              git reset --hard origin/main
              echo "conflict, dropping this run's result"
              exit 1
            fi
            sleep $((RANDOM % 8 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Baseball pids backfill failed - ${date}`,
              body: `Baseball pids backfill failed at ${date}.\n\nWorkflow run: ${context.runId}`,
              labels: ['bug', 'crawler']
            });
