name: Rate Limit Alert

# 크롤러가 받은 HTTP 429(요청 제한) 기록(ops-logs 브랜치)을 읽어 Discord 운영 알림으로 보낸다(2026-10-27).
# cron-job.org 가 10분마다 호출(workflow_dispatch). GitHub schedule 은 누락이 잦아 안전망으로만 둔다.
# 같은 도메인은 30분 쿨다운(그 사이 건수는 합산). 기록은 scripts/lib/watch-429.mjs 가 남긴다.

on:
  schedule:
    - cron: '17,47 * * * *'  # 안전망(30분 간격)
  workflow_dispatch:
    inputs:
      simulate:
        description: '1 = 429 를 시뮬레이션해 기록·알림 경로 전체를 시험(Discord 에 시험 알림이 감)'
        default: ''

permissions:
  contents: write   # ops-logs 브랜치에 상태 기록

concurrency:
  group: rate-limit-alert
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Simulate 429 (시험용)
        if: inputs.simulate == '1'
        env:
          GITHUB_WORKFLOW: 'simulate-429(시험)'
        run: node scripts/simulate-429.mjs

      - name: Report 429
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/report-429.mjs
