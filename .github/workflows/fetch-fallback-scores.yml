name: Fetch Fallback Scores

# 네이버 의존도 절감 P2(2026-10-27) — 네이버가 막혀 일정 수집이 멈춰도 오늘 전후 경기의 진행·종료·점수가 이어지게 ESPN(축구)·MLB Stats API 로 games.json 을 "앞으로만" 보강한다.
# 네이버가 정상이면 같은 값이라 변경 0건(커밋 없음). 실제 주기는 cron-job.org(2분 권장) — GitHub 자체 cron 은 안전망.
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '변경 목록만 출력(저장·커밋 안 함) — true/false'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: fetch-fallback-scores
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply fallback scores
        env:
          FALLBACK_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
        run: node scripts/fetch-fallback-scores.mjs

      # 다음스포츠 보조(KBO·K리그·NPB·유럽 축구)도 같은 실행에서 — 이 워크플로우가 cron-job.org 로 안정적으로 매분 호출되므로 별도 등록 없이 보조 경로가 이어진다(2026-10-27).
      # 짝수 분에만(≈2분 간격) 조회, 진행·임박 경기가 있는 리그만 요청(없으면 0건). 실패해도 이 실행을 실패시키지 않는다.
      - name: Apply Daum scores (even minutes)
        env:
          DAUM_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
        run: |
          if [ $((10#$(date -u +%M) % 2)) -eq 0 ]; then node scripts/fetch-daum-scores.mjs || echo "다음스포츠 보조 실패(무시)"; else echo "다음스포츠: 홀수 분 — 건너뜀"; fi

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain games.json)" ]]; then echo "changed=true" >> $GITHUB_OUTPUT; else echo "changed=false" >> $GITHUB_OUTPUT; fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp games.json games_2026.json
          git add games.json games_2026.json
          git commit -m "chore(data): 보조 원본 점수·상태 보강(ESPN·MLB·다음) ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; echo "rebase failed, retrying"; }
            sleep $((RANDOM % 6 + 1))
          done
          echo "push failed after 20 retries"
          exit 1
