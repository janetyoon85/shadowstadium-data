name: Fetch Fallback Scores

# 네이버 의존도 절감 P2(2026-10-27) — 네이버가 막혀 일정 수집이 멈춰도 오늘 전후 경기의 진행·종료·점수가 이어지게 ESPN(축구)·MLB Stats API 로 games.json 을 "앞으로만" 보강한다.
# 네이버가 정상이면 같은 값이라 변경 0건(커밋 없음). 실제 주기는 cron-job.org(1분) — GitHub 자체 cron 은 안전망.
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '변경 목록만 출력(저장·커밋 안 함) — true/false'
        default: 'false'
      simulate_espn_down:
        description: 'ESPN 불통 시뮬레이션(시험용, API-Sports 실제 호출 1~3건 사용) — true/false'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: fetch-fallback-scores
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply fallback scores
        env:
          FALLBACK_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}   # 네이버 불통 전환 알림(1회)
          # 야후 스포츠(스포츠나비) NPB 승·패·세이브 투수 보조 — 기본 OFF. 야후 이용약관의 자동 접근 허용을 확인한 뒤 저장소 변수 YAHOO_NPB_ENABLED=1 로 켠다(네이버 불통 중에만 동작).
          YAHOO_NPB_ENABLED: ${{ vars.YAHOO_NPB_ENABLED }}
          # ESPN 불통 페일오버 — API-Sports(무료 하루 100건) 로 ESPN 출처 리그 점수·상태 보조. 키는 시크릿, 로그에 남기지 않는다.
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          ESPN_FORCE_DOWN: ${{ github.event.inputs.simulate_espn_down == 'true' && '1' || '' }}
        run: node scripts/fetch-fallback-scores.mjs

      # 다음스포츠 보조(KBO·K리그·NPB·유럽 축구)도 같은 실행에서 — 이 워크플로우가 cron-job.org 로 안정적으로 매분 호출되므로 별도 등록 없이 보조 경로가 이어진다(2026-10-27).
      # 매 실행마다(현재 cron-job.org 가 1분 간격) 호출하되 진행·임박 경기가 있는 리그만 요청한다(없으면 0건). 실패해도 이 실행을 실패시키지 않는다.
      - name: Apply Daum scores
        env:
          DAUM_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
          DAUM_PARTS: games,discover
        run: |
          node scripts/fetch-daum-scores.mjs || echo "다음스포츠 보조 실패(무시)"

      # 순위표 보조(K리그1·2, 다음스포츠) — 순위표가 완료 경기 수보다 뒤처졌을 때만 요청(평소 0건). 실패해도 이 실행을 실패시키지 않는다.
      - name: Apply standings fallback
        env:
          STANDINGS_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
        run: node scripts/fetch-standings-fallback.mjs || echo "순위표 보조 실패(무시)"

      # 유럽 축구 ESPN 보강(카드·승부차기만 games.json 에 병합; euro_*.json·player-name-auto.json 은 이 모드가 저장하지 않고 복원 — 2026-10-27 사고 후) — 네이버 없이 ESPN 만 사용. 호출 위상과 무관하게 실행을 번갈아(약 4분에 1번) 돌리고, 자체 예산·캐시를 가진 기존 보강 함수를 재사용한다.
      - name: Euro ESPN enrichment (alternate runs)
        env:
          EURO_ENRICH_ONLY: '1'
          EURO_ENRICH_DRY: ${{ github.event.inputs.dry == 'true' && '1' || '' }}
        run: |
          if [ $(( $(date +%s) / 60 % 4 )) -eq 0 ] || grep -q '"status": "down"' naver-health.json 2>/dev/null; then node scripts/fetch-schedule.mjs || echo "유럽 보강 실패(무시)"; else echo "유럽 보강: 이번 실행은 건너뜀"; fi

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain games.json standings.json daum-venue-map.json naver-health-alert.json espn-health-alert.json apisports-state.json ops-ledger)" ]]; then echo "changed=true" >> $GITHUB_OUTPUT; else echo "changed=false" >> $GITHUB_OUTPUT; fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp games.json games_2026.json
          git add games.json games_2026.json standings.json daum-venue-map.json
          # 불통 알림 상태(한 번만 알리려고)·API-Sports 하루 사용량 — 파일이 없으면 git add 가 통째로 실패하므로 하나씩(없는 건 건너뜀)
          for f in naver-health-alert.json espn-health-alert.json apisports-state.json; do if [ -e "$f" ]; then git add "$f"; fi; done
          git add -A ops-ledger 2>/dev/null || true   # 복구 기록(일일 보고용)
          git commit -m "chore(data): 보조 원본 점수·상태 보강(ESPN·MLB·다음) ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort 2>/dev/null || true; echo "rebase failed, retrying"; }
            sleep $((RANDOM % 6 + 1))
          done
          echo "push failed after 20 retries"
          exit 1
