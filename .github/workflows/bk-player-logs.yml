name: Basketball Player Game Logs

# 농구 선수별 경기 기록 조각(basketball/player-log/<0-f>.json) 생성(2026-11-25 "구글처럼 선수별 최근 경기·시즌 평균").
# 경기별 박스스코어(box-YYYY-MM.json)와 경기 목록에서 계산만 한다 — 외부 호출 없음. 앱은 선수 카드를 열 때 그 선수의 조각 하나만 받는다.
on:
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bk-player-logs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build player logs
        run: node scripts/build-bk-player-logs.mjs
      - name: Commit and push
        run: |
          if [[ -z "$(git status --porcelain basketball/player-log)" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball/player-log
          git commit -m "chore(data): 농구 선수 경기 기록 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then exit 0; fi
            if ! git pull --rebase --autostash origin main; then
              node scripts/merge-json-conflicts.mjs && GIT_EDITOR=true git rebase --continue || { git rebase --abort; git reset --hard origin/main; exit 1; }
            fi
            sleep $((RANDOM % 8 + 1))
          done
          exit 1
