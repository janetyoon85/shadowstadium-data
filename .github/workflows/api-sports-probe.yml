name: API-Sports Probe

# 일회성 점검(2026-10-13): 무료 키로 종목별 "오늘 경기"가 조회되는지 확인한다. 키는 출력하지 않는다. 확인 후 삭제 예정.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          node -e "
          const K = process.env.API_SPORTS_KEY;
          if (!K) { console.log('NO KEY'); process.exit(1); }
          const day = (o) => new Date(Date.now() + o * 86400000).toISOString().slice(0, 10);
          const S = [
            ['football', 'v3.football.api-sports.io', '/fixtures?date=', (x) => [x.league.country, x.league.name]],
            ['baseball', 'v1.baseball.api-sports.io', '/games?date=', (x) => [x.country && x.country.name, x.league && x.league.name]],
            ['basketball', 'v1.basketball.api-sports.io', '/games?date=', (x) => [x.country && x.country.name, x.league && x.league.name]],
            ['hockey', 'v1.hockey.api-sports.io', '/games?date=', (x) => [x.country && x.country.name, x.league && x.league.name]],
            ['volleyball', 'v1.volleyball.api-sports.io', '/games?date=', (x) => [x.country && x.country.name, x.league && x.league.name]],
            ['handball', 'v1.handball.api-sports.io', '/games?date=', (x) => [x.country && x.country.name, x.league && x.league.name]],
          ];
          (async () => {
            for (const [name, host, path, f] of S) {
              const agg = {};
              for (const o of [-1, 0, 1]) {
                const r = await fetch('https://' + host + path + day(o), { headers: { 'x-apisports-key': K } });
                const j = await r.json();
                for (const x of j.response || []) { const [c, l] = f(x); const k = (c || '?') + ' | ' + (l || '?'); agg[k] = (agg[k] || 0) + 1; }
                await new Promise((r) => setTimeout(r, 1200));
              }
              const rows = Object.entries(agg).sort((a, b) => b[1] - a[1]);
              console.log('SPORT', name, 'leagues', rows.length, 'games', rows.reduce((a, b) => a + b[1], 0));
              for (const [k, n] of rows) console.log('L', name, k, n);
            }
          })();
          "
