name: API-Sports Probe

# 일회성 점검(2026-10-13): 무료 키로 종목별 "오늘 경기"가 조회되는지 확인한다. 키는 출력하지 않는다. 확인 후 삭제 예정.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: |
          node -e "
          const K = process.env.API_SPORTS_KEY;
          if (!K) { console.log('NO KEY'); process.exit(1); }
          const today = new Date().toISOString().slice(0, 10);
          const S = [
            ['football', 'v3.football.api-sports.io', '/fixtures?date='],
            ['baseball', 'v1.baseball.api-sports.io', '/games?date='],
            ['basketball', 'v1.basketball.api-sports.io', '/games?date='],
            ['hockey', 'v1.hockey.api-sports.io', '/games?date='],
            ['volleyball', 'v1.volleyball.api-sports.io', '/games?date='],
            ['handball', 'v1.handball.api-sports.io', '/games?date='],
            ['rugby', 'v1.rugby.api-sports.io', '/games?date='],
            ['american-football', 'v1.american-football.api-sports.io', '/games?date='],
            ['afl', 'v1.afl.api-sports.io', '/games?date='],
            ['nba', 'v2.nba.api-sports.io', '/games?date='],
            ['mma', 'v1.mma.api-sports.io', '/fights?date='],
          ];
          (async () => {
            for (const [name, host, path] of S) {
              for (const d of [today, '2024-03-15']) {
                try {
                  const r = await fetch('https://' + host + path + d, { headers: { 'x-apisports-key': K } });
                  const j = await r.json();
                  const err = j.errors && (Array.isArray(j.errors) ? j.errors.join('|') : JSON.stringify(j.errors));
                  const leagues = [...new Set((j.response || []).map((x) => (x.league && (x.league.name || x.league)) || x.country?.name || '').filter(Boolean).map((x) => typeof x === 'string' ? x : x.name))].slice(0, 6);
                  console.log(name, d, 'http', r.status, 'results', j.results, 'rem', r.headers.get('x-ratelimit-requests-remaining'), err ? 'ERR ' + err.slice(0, 160) : '', leagues.length ? 'leagues: ' + leagues.join(',') : '');
                } catch (e) { console.log(name, d, 'fail', e.message); }
                await new Promise((r) => setTimeout(r, 1200));
              }
            }
          })();
          "
