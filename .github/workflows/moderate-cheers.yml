name: Moderate Cheers

# 응원 한마디 운영 점검(2026-11-21) — 신고 집계·자동 가림·금칙어 재점검·오래된 글 정리. 새 신고·자동 가림이 있을 때만 Discord 알림.
# 스케줄 + cron-job.org 외부 트리거(workflow_dispatch)로 돌 수 있다. 기능을 켜기 전에도 돌아도 안전(글·신고가 없으면 아무것도 안 함).

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # cheer-moderation-state.json commit

concurrency:
  group: moderate-cheers
  cancel-in-progress: false

jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Moderate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATA_ROOT: ${{ github.workspace }}
        run: node scripts/moderate-cheers.mjs

      - name: Notify team rooms
        # 팀 응원방 새 글 알림(2026-11-27) — 점검(가림)이 끝난 뒤 실행해 가려진 글은 알리지 않는다. 방당 3시간에 한 번, 본문 미포함.
        continue-on-error: true
        timeout-minutes: 3   # 이 단계가 멈춰도 뒤의 '상태 저장'이 건너뛰어지지 않게(2026-11-28 — 연결이 안 닫혀 5분씩 멈추다 워크플로 전체가 취소되던 문제)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
        run: node scripts/notify-team-room.mjs

      - name: Commit state
        if: ${{ always() }}   # 앞 단계가 시간 초과로 끝나도 상태는 저장한다(저장이 빠지면 같은 응원 글 알림이 20분마다 반복된다)
        run: |
          FILES="cheer-moderation-state.json sent-team-room.json team-rooms.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then exit 0; fi
          # 저장소가 몇 초마다 갱신돼 pull --rebase 는 매번 밀린다 — 최신 main 위에 이 파일들만 얹어 바로 푸시한다(작업 폴더를 건드리지 않음)
          for i in $(seq 1 15); do
            git fetch -q --depth=1 origin main
            export GIT_INDEX_FILE="$RUNNER_TEMP/idx.cheers"; rm -f "$GIT_INDEX_FILE"
            git read-tree FETCH_HEAD
            for f in $FILES; do
              if [ -e "$f" ]; then git update-index --add --cacheinfo 100644,$(git hash-object -w "$f"),"$f"; fi
            done
            tree=$(git write-tree)
            c=$(git commit-tree "$tree" -p FETCH_HEAD -m "chore(cheers): 운영 점검 상태 [skip ci]")
            unset GIT_INDEX_FILE
            if git push origin "$c:refs/heads/main"; then exit 0; fi
            sleep $((RANDOM % 4 + 1))
          done
          exit 1
