name: Basketball Player Info Backfill

on:
  schedule:
    - cron: '20 * * * *'  # 2026-11-20: 3시간 → 1시간(B.LEAGUE·EuroLeague 프로필 자동 보강을 빨리 끝내고 새 선수도 한 시간 안에 채운다)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-basketball-players
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # 최신 main 기준(큐 대기 중 낡은 커밋 방지)

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run basketball player info backfill
        run: node scripts/backfill-basketball-players.mjs
      - name: Fill B.LEAGUE / EuroLeague / Wikidata profiles (2026-11-20)
        run: node scripts/backfill-basketball-extra-info.mjs
        env:
          BK_EXTRA_BUDGET: '250'
      - name: Commit and push
        run: |
          if [[ -z "$(git status --porcelain basketball/player-info.json basketball/player-info-extra.json basketball/api-cooldown.json ops-ledger)" ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball/player-info.json
          if [ -f basketball/player-info-extra.json ]; then git add basketball/player-info-extra.json; fi
          if [ -f basketball/api-cooldown.json ]; then git add basketball/api-cooldown.json; fi
          git add ops-ledger 2>/dev/null || true
          git commit -m "chore(data): 농구 선수 프로필 백필 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then exit 0; fi
            if ! git pull --rebase --autostash origin main; then
              node scripts/merge-json-conflicts.mjs && GIT_EDITOR=true git rebase --continue || { git rebase --abort; git reset --hard origin/main; exit 1; }
            fi
            sleep $((RANDOM % 8 + 1))
          done
          exit 1
