name: ESPN League Standings Fetch

on:
  schedule:
    # Naver 순위표(fetch-standings.yml)와 같은 이유로 3시간 주기 — 순위는 경기 하나 끝난다고
    # 매번 안 바뀌니 5분 주기 크론들과 예산 경합시킬 이유 없음. Naver 크론과 겹치지 않게 45분 오프셋.
    - cron: '45 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ESPN standings fetch
        run: node scripts/fetch-espn-standings.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain standings.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add standings.json
          git commit -m "chore(data): ESPN 이색리그 순위표 동기화 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            git pull --rebase origin main
            sleep $((RANDOM % 30 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 ESPN standings fetch failed - ${date}`,
              body: `ESPN standings crawler failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide ESPN 순위표 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
