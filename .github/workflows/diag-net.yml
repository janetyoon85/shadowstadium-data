name: Diag Net

# 집 러너(NAS/PC)에서 외부 접속 진단(읽기 전용) — 공인 IP, 네이버 API(curl·node), ESPN. 수동 실행.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: '러너 라벨 — nas 또는 home-crawler'
        default: 'nas'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ${{ github.event.inputs.runner || 'nas' }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Diagnose
        run: |
          echo "runner: $RUNNER_NAME"
          echo "--- NAVER 환경변수"; env | grep "^NAVER_" || echo "(없음)"
          echo "--- /guard"; ls -l /guard 2>&1 | head -5
          echo "public ip: $(curl -s -m 10 https://api.ipify.org || echo fail)"
          U='https://api-gw.sports.naver.com/schedule/games?fromDate=2026-10-27&toDate=2026-10-28&upperCategoryId=kbaseball&categoryId=kbo&size=5&page=1'
          for i in 1 2 3; do curl -s -o /dev/null -m 20 -w "curl naver api: HTTP %{http_code} %{time_total}s\n" -H "User-Agent: Mozilla/5.0" "$U" || echo "curl naver api FAIL exit=$?"; done
          echo "--- TLS 변형별 curl (같은 러너)"
          curl -V | head -1
          curl -s -o /dev/null -m 12 -w "tls1.2 제한: HTTP %{http_code} %{time_total}s\n" --tls-max 1.2 -H "User-Agent: Mozilla/5.0" "$U" || echo "tls1.2 제한 FAIL exit=$?"
          curl -s -o /dev/null -m 12 -w "tls1.3 AES128만: HTTP %{http_code} %{time_total}s\n" --tls13-ciphers TLS_AES_128_GCM_SHA256 -H "User-Agent: Mozilla/5.0" "$U" || echo "tls1.3 AES128만 FAIL exit=$?"
          curl -s -o /dev/null -m 12 -w "http1.1 강제: HTTP %{http_code} %{time_total}s\n" --http1.1 -H "User-Agent: Mozilla/5.0" "$U" || echo "http1.1 FAIL exit=$?"
          node -e "
          const U='$U';
          (async()=>{for(let i=0;i<3;i++){const t=Date.now();try{const r=await fetch(U,{headers:{'User-Agent':'Mozilla/5.0'},signal:AbortSignal.timeout(20000)});console.log('node naver api: HTTP',r.status,Date.now()-t,'ms')}catch(e){console.log('node naver api FAIL',Date.now()-t,'ms',e.cause&&e.cause.code||e.message)}}})()"
          cat > "$RUNNER_TEMP/tls.mjs" <<'JS'
          import tls from 'node:tls';
          const U = process.argv[2];
          const modes = [['node 기본(TLS1.3)', null], ['node TLS1.2 제한', 'TLSv1.2']];
          for (const [name, max] of modes) {
            if (max) tls.DEFAULT_MAX_VERSION = max;
            for (let i = 0; i < 2; i++) {
              const t = Date.now();
              try {
                const r = await fetch(U, { headers: { 'User-Agent': 'Mozilla/5.0 (compatible; shadowstadium)' }, signal: AbortSignal.timeout(12000) });
                console.log(name + ': HTTP ' + r.status + ' ' + (Date.now() - t) + 'ms');
              } catch (e) { console.log(name + ': 실패 ' + (e.cause && e.cause.code || e.name) + ' ' + (Date.now() - t) + 'ms'); }
            }
          }
JS
          echo "--- node TLS 변형 (같은 러너)"; node "$RUNNER_TEMP/tls.mjs" "$U"
          curl -s -o /dev/null -m 15 -w "curl espn: HTTP %{http_code} %{time_total}s\n" https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard || echo "espn FAIL"
          echo "node $(node -v 2>&1)"; uptime 2>/dev/null || true
