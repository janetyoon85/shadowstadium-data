name: Fetch Basketball

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-basketball
  cancel-in-progress: false

jobs:
  # 어느 러너에서 돌릴지 정한다(GitHub 서버에서 네이버가 응답하면 GitHub 서버, 아니면 집 PC) — .github/workflows/pick-runner.yml
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
  fetch:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1분 주기(2026-10-26): 매 실행 npm 설치가 45~50초(크롤링은 10초)라 한 바퀴가 1분을 넘겼다 → node_modules 를 캐시하고 없을 때만 설치.
      - name: Cache PDF parser
        id: pdfcache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: pdfjs-dist-3.11.174-${{ runner.os }}

      - name: Install PDF parser (Asian Games box scores)
        if: steps.pdfcache.outputs.cache-hit != 'true'
        run: npm i --no-save --no-package-lock pdfjs-dist@3.11.174

      - name: Run basketball crawler
        run: node scripts/fetch-basketball.mjs


      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain basketball)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball
          git commit -m "chore(data): 농구 데이터 갱신 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            git pull --rebase -X theirs origin main || git rebase --abort
            sleep $((RANDOM % 30 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Basketball crawler failed - ${date}`,
              body: `Basketball crawler failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide 농구 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
