name: Fetch Basketball

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-basketball
  cancel-in-progress: false

# 네이버 API 호환(Node TLS1.3 핸드셰이크 후 멈춤 회피) — scripts/lib/naver-tls.mjs
env:
  NAVER_TLS12: '1'
  # 페일오버 신호(2026-10-30) — 이 크롤러가 끝날 때 네이버 요청 통계로 건강 상태를 이 파일에 기록한다(상태 전환·10분 하트비트에만 갱신).
  NAVER_HEALTH_FILE: naver-health.json

jobs:
  # 어느 러너에서 돌릴지 정한다(GitHub 서버에서 네이버가 응답하면 GitHub 서버, 아니면 집 PC) — .github/workflows/pick-runner.yml
  pick:
    uses: ./.github/workflows/pick-runner.yml
    secrets: inherit
    with:
      # 네이버 정지 중에도 NBA·WNBA 등 ESPN 리그는 계속 갱신(GitHub 서버, 네이버 호출 금지). KBL·WKBL 은 기존 데이터 유지.
      fallback_runner: ubuntu-latest
  fetch:
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1분 주기(2026-10-26): 매 실행 npm 설치가 45~50초(크롤링은 10초)라 한 바퀴가 1분을 넘겼다. actions/cache 는 NAS 에서 복원만 62초라 소용없었다 →
      # 러너 머신의 영구 폴더(_tool 캐시)에 한 번만 설치해 두고 매번 연결만 한다(GitHub 서버 러너는 매번 새 머신이라 예전처럼 설치).
      - name: Install PDF parser (Asian Games box scores)
        run: |
          D="${RUNNER_TOOL_CACHE:-$HOME}/shadeside-pdfjs-3.11.174"
          if [ ! -d "$D/node_modules/pdfjs-dist" ]; then
            mkdir -p "$D" && (cd "$D" && npm i --no-save --no-package-lock pdfjs-dist@3.11.174)
          fi
          rm -rf node_modules && ln -sfn "$D/node_modules" node_modules
          test -d node_modules/pdfjs-dist

      - name: Run basketball crawler
        env:
          NAVER_DISABLED: ${{ needs.pick.outputs.naver_disabled }}
        run: node scripts/fetch-basketball.mjs


      # 다음스포츠 농구(KBL·WKBL) 보강 — 네이버 정지 중에도 점수·상태가 이어지게. 같은 체크아웃·같은 커밋에서 돌려 이 작업의 games.json 덮어쓰기와 경합하지 않는다(2026-10-27).
      - name: Apply Daum basketball overlay
        env:
          DAUM_PARTS: basketball
        run: node scripts/fetch-daum-scores.mjs || echo "다음스포츠 농구 보강 실패(무시)"

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain basketball naver-health.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add basketball
          git add naver-health.json 2>/dev/null || true   # 네이버 건강 신호
          git commit -m "chore(data): 농구 데이터 갱신 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            git pull --rebase --autostash -X theirs origin main || git rebase --abort
            sleep $((RANDOM % 6 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Basketball crawler failed - ${date}`,
              body: `Basketball crawler failed at ${date}.\n\nWorkflow run: ${context.runId}\nLogs: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'crawler']
            });
      - name: Discord 알림 (실패 시)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\":\"🔴 ShadeSide 농구 크롤러 실패\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
