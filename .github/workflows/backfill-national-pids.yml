name: National Pids Backfill

on:
  schedule:
    # 6시간마다 — 성인 대표팀 경기의 ID 없는 선수를 클럽 ESPN ID 와 국적·선수단 대조로 검증해 연결표를 만든다(요청 간격 0.4s).
    - cron: '50 */6 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: '이번 실행에서 검증할 후보 수'
        default: '200'

permissions:
  contents: write
  issues: write

concurrency:
  group: backfill-national-pids
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 큐에서 기다리다 늦게 시작해도 최신 main(보낸 알림·상태 기록)을 받는다 — 기본값은 요청 시점의 옛 커밋이라 알림이 다시 나갔다

      - name: Fetch crawler code (private)
        uses: ./.github/actions/fetch-code
        with:
          token: ${{ secrets.PRIVATE_DATA_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Link national pids
        env:
          NATIONAL_PID_BUDGET: ${{ github.event.inputs.budget || '200' }}
        run: node scripts/backfill-national-pids.mjs

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain national-pid-links.json)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add national-pid-links.json
          git commit -m "chore(data): 대표팀 선수 pid 연결표 갱신 ($(date +'%Y-%m-%d %H:%M'))"
          for i in $(seq 1 20); do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main and retrying ($i/20)"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              git reset --hard origin/main
              echo "conflict, dropping this run's result"
              exit 1
            fi
            sleep $((RANDOM % 8 + 1))
          done
          echo "push failed after 20 retries"
          exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 National pids backfill failed - ${date}`,
              body: `National pids backfill failed at ${date}.\n\nWorkflow run: ${context.runId}`,
              labels: ['bug', 'crawler']
            });
