# NAS 라이브 폴러 — Container Manager > 프로젝트 > 생성 에 붙여넣기(프로젝트 이름: shadeside-live)
# 진행 중인 경기가 있을 때만 20초 주기로 크롤링해 Firebase Realtime Database(live/*_fast)에 게시한다. 경기가 없으면 요청을 보내지 않는다.
# 필요한 비밀은 FIREBASE_DB_SECRET 하나(Realtime Database 전용 비밀키 — 라이브 점수만 건드릴 수 있고 푸시는 못 보낸다). 아래 "여기에_" 부분만 바꾼다.
# 저장소는 공개라 토큰 없이 클론한다. 컨테이너가 재시작돼도 최신 코드로 맞춘 뒤 실행한다.
services:
  live-poller:
    image: node:22-bookworm-slim
    container_name: shadeside-live-poller
    restart: unless-stopped
    mem_limit: 1g
    environment:
      TZ: Asia/Seoul
      FIREBASE_DATABASE_URL: "https://shadowstadium-default-rtdb.asia-southeast1.firebasedatabase.app"
      FIREBASE_DB_SECRET: "여기에_데이터베이스_비밀키"
      LIVE_INTERVAL_S: "20"
      # 네이버 호출 간격(초) — 2026-10-27 차단 사건 후 기본 30초(농구·ESPN 은 LIVE_INTERVAL_S 그대로). 코드 기본값이 30 이라 비워 둬도 된다.
      NAVER_LIVE_INTERVAL_S: "20"   # 2026-10-30 NAS 에서 20초로 낮춤(TLS1.2·타임아웃 수정 뒤 안정 확인) — 차단 사건 직후엔 30초였다
      # Node 의 TLS1.3 핸드셰이크 뒤 응답이 멈추는 현상 회피(scripts/lib/naver-tls.mjs) — 네이버 호출에 필요
      NAVER_TLS12: "1"
      # (비공개 크롤러 코드) shadowstadium-crawler 읽기 전용 토큰 — 공개 저장소에서 scripts/ 가 빠진 뒤에도 코드를 받는다. 비워 두면 공개 저장소의 scripts/ 를 그대로 쓴다.
      CODE_TOKEN: ""
      REPO_DIR: /app/repo
      # DISCORD_WEBHOOK_URL: "여기에_웹훅"   # (선택) 429 로 멈출 때 Discord 알림
    command:
      - sh
      - -c
      - |
        command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null)
        [ -d /app/repo/.git ] || git clone -q --depth 1 https://github.com/janetyoon85/shadowstadium-data.git /app/repo
        cd /app/repo && git fetch -q --depth 1 origin main && git reset -q --hard FETCH_HEAD
        if [ -n "$$CODE_TOKEN" ]; then
          command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl >/dev/null)
          t=$$(mktemp -d)
          if curl -fsSL --retry 3 -H "Authorization: Bearer $$CODE_TOKEN" https://api.github.com/repos/janetyoon85/shadowstadium-crawler/tarball/main -o $$t/c.tgz && mkdir $$t/s && tar -xzf $$t/c.tgz -C $$t/s --strip-components=1 && [ -d $$t/s/scripts ]; then
            rm -rf /app/repo/scripts && cp -r $$t/s/scripts /app/repo/scripts && echo "비공개 코드 적용"
          else
            echo "비공개 코드 받기 실패 - 저장소의 scripts/ 사용"
          fi
          rm -rf $$t
        fi
        exec node scripts/live-daemon.mjs
